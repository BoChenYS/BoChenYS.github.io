ont-weight=\"800\" text-anchor=\"middle\" fill=\"#8E2A22\" font-family=\"ui-rounded,Avenir Next,sans-serif\">L4·09<\/text><\/svg>","items":[{"zh":"从前有一座山。","py":"cóng qián yǒu yí zuò shān.","en":"Once upon a time there was a mountain.","ic":"⛰️","ex":"山里有一座庙。","exen":"On the mountain there was a temple.","a":"f5f54880a8a249f6","b":"7b3a2fe177e35ac1","e":"9d309746f5453ee5","eb":"6df999c2786a2add"},{"zh":"很久很久以前……","py":"hěn jiǔ hěn jiǔ yǐ qián……","en":"Long, long ago...","ic":"📜","ex":"有一只聪明的小兔子。","exen":"There lived a clever little rabbit.","a":"4f3dc7259fcbf5ea","b":"b60de0acc67cc63a","e":"66ab54e8092981b5","eb":"c8a40452f69427e0"},{"zh":"有一天……","py":"yǒu yì tiān……","en":"One day...","ic":"☀️","ex":"小熊去森林里找蜂蜜。","exen":"Little Bear went into the forest to look for honey.","a":"62fcb20d5e3d3e2d","b":"d9ba3c8e9bb19e9a","e":"d8de876d96d513f4","eb":"60013fc328aafa7c"},{"zh":"后来……","py":"hòu lái……","en":"Later on...","ic":"⏩","ex":"后来，天下起了大雨。","exen":"Later, it started to pour with rain.","a":"1e84e4c6f375bcc0","b":"9b4ab46c85d3e9ed","e":"d1707fbe914367a0","eb":"f32e2d863627f997"},{"zh":"最后……","py":"zuì hòu……","en":"In the end...","ic":"🔚","ex":"最后，大家都成了好朋友。","exen":"In the end, everyone became good friends.","a":"b18f8eef5726b0fa","b":"cd614c72d8a95037","e":"1c06f7bc44ca289d","eb":"64055224293e24fa"},{"zh":"突然……","py":"tū rán……","en":"Suddenly...","ic":"⚡","ex":"突然，跳出来一只大老虎！","exen":"Suddenly, out jumped a big tiger!","a":"6142ef2a4ec620f3","b":"e0f1e0b688d65d27","e":"5e6fcc657d33e361","eb":"9e828fed1e93963f"},{"zh":"于是……","py":"yú shì……","en":"So then...","ic":"🔗","ex":"于是，小猴子想了个办法。","exen":"So then, the little monkey came up with a plan.","a":"ab522feb31624648","b":"887d468224ddb5cf","e":"17f3ce3a2f315603","eb":"6273b2027dd3274f"},{"zh":"第二天早上……","py":"dì èr tiān zǎo shang……","en":"The next morning...","ic":"🌄","ex":"小鸟唱着歌把它叫醒了。","exen":"A little bird woke it up with a song.","a":"f6c20145cb67ec1b","b":"dcb7407adb7ca75d","e":"29f7a4e2de5aaf40","eb":"4f5f70d281f3228c"},{"zh":"在一片大森林里……","py":"zài yí piàn dà sēn lín lǐ……","en":"In a big forest...","ic":"🌲","ex":"住着很多小动物。","exen":"There lived lots of little animals.","a":"ddaa282ae59e7411","b":"aa7f5c7211f8f76c","e":"22122b492b2f5044","eb":"4792ed4bc004623b"},{"zh":"小兔子蹦蹦跳跳地出门了。","py":"xiǎo tù zi bèng bèng tiào tiào de chū mén le.","en":"The little rabbit hopped out the door.","ic":"🐰","ex":"它要去外婆家。","exen":"She was off to Grandma's house.","a":"37b3332ded672ae5","b":"560b8faf36feffe9","e":"4ae9f4e3bf68f27f","eb":"ee47c215bcd2932a"},{"zh":"小猫在河边钓鱼。","py":"xiǎo māo zài hé biān diào yú.","en":"The kitten went fishing by the river.","ic":"🎣","ex":"一会儿捉蝴蝶，一会儿捉蜻蜓。","exen":"One moment chasing butterflies, the next dragonflies.","a":"c8370c0526551d15","b":"3baf72b9c763a2b0","e":"56c6e6801c91fb71","eb":"617a79262ad93589"},{"zh":"乌鸦口渴了，到处找水喝。","py":"wū yā kǒu kě le, dào chù zhǎo shuǐ hē.","en":"The thirsty crow looked everywhere for water.","ic":"🐦‍⬛","ex":"它把石子放进瓶子里。","exen":"It dropped pebbles into the bottle.","a":"e2678fd60a474d87","b":"7681ea8a09ab5bc7","e":"043221a20b698ab2","eb":"d375a7280a655a1f"},{"zh":"小蝌蚪在找妈妈。","py":"xiǎo kē dǒu zài zhǎo mā ma.","en":"The little tadpoles are looking for their mum.","ic":"🐸","ex":"原来妈妈是青蛙呀！","exen":"It turns out their mum is a frog!","a":"ceda096c3e644f9f","b":"6de993240e284904","e":"ff6a383a55c34844","eb":"d1146525b4d371ae"},{"zh":"他们高高兴兴地回家了。","py":"tā men gāo gāo xìng xìng de huí jiā le.","en":"They went home happily.","ic":"😃","ex":"故事讲完了。","exen":"And that's the end of the story.","a":"02792314847100a1","b":"7382b57acfd1df25","e":"c714ff459740218b","eb":"eb891f92fcb1db2a"},{"zh":"你猜接下来会怎样？","py":"nǐ cāi jiē xià lái huì zěn yàng?","en":"Guess what happens next?","ic":"🤔","ex":"我猜小狗会找到骨头！","exen":"I guess the puppy will find the bone!","a":"cad160fa11717319","b":"78a0b862a9c92733","e":"750622aaf76abc18","eb":"667427ee010a4d6f"},{"zh":"图上画的是什么？","py":"tú shàng huà de shì shén me?","en":"What's in the picture?","ic":"🖼️","ex":"画的是一只大熊猫。","exen":"It's a giant panda.","a":"fcc3e2f198ab4b74","b":"08cce593db94958a","e":"6ffc59a98be782b9","eb":"54bab680f1b5c708"},{"zh":"太阳公公笑眯眯。","py":"tài yáng gōng gong xiào mī mī.","en":"Grandpa Sun is smiling.","ic":"🌞","ex":"小花都抬起了头。","exen":"All the little flowers lifted their heads.","a":"179760d0afd363bc","b":"9fa8637ba0b4316c","e":"9b1f2d13d85bab0b","eb":"33c7ba5fe828944b"},{"zh":"天黑了，月亮出来了。","py":"tiān hēi le, yuè liang chū lai le.","en":"It got dark and the moon came out.","ic":"🌃","ex":"星星眨着眼睛。","exen":"The stars were twinkling.","a":"6a89837ca0271df7","b":"634cc9c9122b9b06","e":"10959c35337025d6","eb":"78ec9d723e766fb3"},{"zh":"大灰狼来了！","py":"dà huī láng lái le!","en":"The big bad wolf is coming!","ic":"🐺","ex":"小猪们快躲进砖房子！","exen":"Little pigs, quick, hide in the brick house!","a":"569b442500e671f2","b":"918d0dc96bd1702d","e":"fce6f3ed4cc660d7","eb":"28a11d7daa737641"},{"zh":"狐狸想了一个坏主意。","py":"hú li xiǎng le yí gè huài zhǔ yi.","en":"The fox came up with a sneaky plan.","ic":"🦊","ex":"它骗乌鸦唱歌，肉掉了。","exen":"It tricked the crow into singing, and the meat fell.","a":"5588e1bd151426fd","b":"be33bedeafe1c9ed","e":"ed97ac9060020313","eb":"f3782dc214d86e7b"},{"zh":"大家都夸他真勇敢。","py":"dà jiā dōu kuā tā zhēn yǒng gǎn.","en":"Everyone praised him for being brave.","ic":"🏅","ex":"他心里美滋滋的。","exen":"He felt very pleased inside.","a":"e3448376f0d7e3be","b":"075495c389b587e6","e":"51f73a7021221865","eb":"7cf67355529dc5fa"},{"zh":"它们成了好朋友。","py":"tā men chéng le hǎo péng you.","en":"They became good friends.","ic":"🤝","ex":"每天一起玩耍。","exen":"They played together every day.","a":"3561ff2e41bd49e8","b":"8d12a0e454be8010","e":"a552fe716101afe7","eb":"96a5a96833fcd08b"},{"zh":"一只小鸭子迷路了。","py":"yì zhī xiǎo yā zi mí lù le.","en":"A little duckling got lost.","ic":"🦆","ex":"它呱呱地叫妈妈。","exen":"It quacked and called for its mum.","a":"6d8f798cb450adc0","b":"989ce6b44a764854","e":"15c8941272428092","eb":"adaab267d92ba76b"},{"zh":"可是，门打不开了。","py":"kě shì, mén dǎ bu kāi le.","en":"But the door wouldn't open.","ic":"🔒","ex":"它急得团团转。","exen":"It ran around in a panic.","a":"7c791dc9983d9763","b":"68bc831b6c1091e7","e":"1f20f2864b67573d","eb":"03af97b821df53be"},{"zh":"就在这时……","py":"jiù zài zhè shí……","en":"Just then...","ic":"⏰","ex":"一位老爷爷走了过来。","exen":"An old grandpa walked over.","a":"ab47e8edfac2af0f","b":"e5c3c553dd29894b","e":"79395af1b868d3ab","eb":"6781fe12473932e3"},{"zh":"农夫种了一棵大萝卜。","py":"nóng fū zhòng le yì kē dà luó bo.","en":"The farmer planted a giant turnip.","ic":"🌱","ex":"拔呀拔，拔不动！","exen":"They pulled and pulled, but it wouldn't budge!","a":"d725e68b90017612","b":"f95f24bb462298f8","e":"9b093bf7912ed736","eb":"8942b14da5a5e275"},{"zh":"龟兔赛跑开始了。","py":"guī tù sài pǎo kāi shǐ le.","en":"The tortoise and the hare began their race.","ic":"🐢","ex":"兔子半路睡着了。","exen":"The hare fell asleep halfway.","a":"c17a4b6f206676d4","b":"67f03f2ed54437dd","e":"07e67cb89a024add","eb":"052f85987eea8b4c"},{"zh":"从此，他们过上了幸福的生活。","py":"cóng cǐ, tā men guò shàng le xìng fú de shēng huó.","en":"From then on, they lived happily ever after.","ic":"💖","ex":"好故事，再讲一遍！","exen":"Great story, tell it again!","a":"fa12fb11da2103a6","b":"5ed5d94c66bb5853","e":"310e4b6430abe8ae","eb":"f56a36e92789f796"},{"zh":"先……然后……","py":"xiān…… rán hòu……","en":"First... then...","ic":"🪜","ex":"先穿袜子，然后穿鞋。","exen":"First socks, then shoes.","a":"bd008376decfe9a1","b":"b2a8d352b472c507","e":"03ad5399e78e68c3","eb":"db1d29b739be71ac"},{"zh":"因为……所以……","py":"yīn wèi…… suǒ yǐ……","en":"Because... so...","ic":"💭","ex":"因为下雨，所以带伞。","exen":"Because it's raining, we bring an umbrella.","a":"575fc171e3a29547","b":"db2d38ed224e5345","e":"f9b71a0211fa4b23","eb":"171b94b3daf03b7e"},{"zh":"河上有一座小桥。","py":"hé shàng yǒu yí zuò xiǎo qiáo.","en":"There's a little bridge over the river.","ic":"🌉","ex":"小羊要过桥去吃草。","exen":"The little goat wants to cross it to eat grass.","a":"5c324ae8a7030013","b":"9b05dd2fcb0b05a7","e":"24cf8ce071600a96","eb":"d76f428e4310f25d"},{"zh":"我来讲一个故事。","py":"wǒ lái jiǎng yí gè gù shi.","e h":"夜来风雨声，","py":"yè lái fēng yǔ shēng,","en":"Last night came the sound of wind and rain,","ic":"🌧️","ex":"唐·孟浩然《春晓》","exen":"Meng Haoran, 'Spring Dawn' (Tang)","a":"12261c1f72158454","b":"35fd9c94dfffa232","e":"ec11a4343946f3d5","eb":"fefd439f30927415"},{"zh":"花落知多少。","py":"huā luò zhī duō shǎo.","en":"How many flowers have fallen, I wonder?","ic":"🌸","ex":"唐·孟浩然《春晓》","exen":"Meng Haoran, 'Spring Dawn' (Tang)","a":"68d80011c3c5ec2d","b":"35fd9c94dfffa232","e":"aade9d292ce447c7","eb":"fefd439f30927415"},{"zh":"曲项向天歌。","py":"qū xiàng xiàng tiān gē.","en":"Curving its neck, it sings to the sky.","ic":"🦢","ex":"唐·骆宾王《咏鹅》","exen":"Luo Binwang, 'Ode to the Goose' (Tang)","a":"214f2eff748b49a3","b":"7904ac9620552176","e":"8cc6771c5f9f37dd","eb":"0bb92a32430e365c"},{"zh":"白毛浮绿水，","py":"bái máo fú lǜ shuǐ,","en":"White feathers float on green water,","ic":"🪶","ex":"唐·骆宾王《咏鹅》","exen":"Luo Binwang, 'Ode to the Goose' (Tang)","a":"08d9044814d1c019","b":"7904ac9620552176","e":"f70ea5adfc68ba45","eb":"0bb92a32430e365c"},{"zh":"红掌拨清波。","py":"hóng zhǎng bō qīng bō.","en":"Red feet paddle the clear ripples.","ic":"🌊","ex":"唐·骆宾王《咏鹅》","exen":"Luo Binwang, 'Ode to the Goose' (Tang)","a":"f1af26875add8d1e","b":"7904ac9620552176","e":"759307f659cecb08","eb":"0bb92a32430e365c"},{"zh":"锄禾日当午，","py":"chú hé rì dāng wǔ,","en":"Hoeing the crops under the noon sun,","ic":"☀️","ex":"唐·李绅《悯农》","exen":"Li Shen, 'Pity the Farmers' (Tang)","a":"1e0e8fc4693fe384","b":"7cc8a3757bb96c57","e":"27a553d8adffd090","eb":"89ef8637c6c45b61"},{"zh":"汗滴禾下土。","py":"hàn dī hé xià tǔ.","en":"Sweat drips onto the soil beneath the plants.","ic":"💦","ex":"唐·李绅《悯农》","exen":"Li Shen, 'Pity the Farmers' (Tang)","a":"32cc2c450f4a16e1","b":"7cc8a3757bb96c57","e":"10b42d172960f60f","eb":"89ef8637c6c45b61"},{"zh":"谁知盘中餐，","py":"shuí zhī pán zhōng cān,","en":"Who knows that the food on our plates —","ic":"🍚","ex":"唐·李绅《悯农》","exen":"Li Shen, 'Pity the Farmers' (Tang)","a":"6e38d386b8c20bd7","b":"7cc8a3757bb96c57","e":"bd151bd9f18ec61b","eb":"89ef8637c6c45b61"},{"zh":"粒粒皆辛苦。","py":"lì lì jiē xīn kǔ.","en":"Every single grain comes from hard work.","ic":"🌾","ex":"唐·李绅《悯农》","exen":"Li Shen, 'Pity the Farmers' (Tang)","a":"139180444e79a160","b":"7cc8a3757bb96c57","e":"72dab7892dc74c3f","eb":"89ef8637c6c45b61"},{"zh":"白日依山尽，","py":"bái rì yī shān jìn,","en":"The white sun sinks behind the mountains,","ic":"🌄","ex":"唐·王之涣《登鹳雀楼》","exen":"Wang Zhihuan, 'Climbing Stork Tower' (Tang)","a":"7f73c6765ce1af3f","b":"5f897e8053f8b3e2","e":"0a2c6f01ef45f34e","eb":"840a57eed573d7a1"},{"zh":"黄河入海流。","py":"huáng hé rù hǎi liú.","en":"The Yellow River flows into the sea.","ic":"🏞️","ex":"唐·王之涣《登鹳雀楼》","exen":"Wang Zhihuan, 'Climbing Stork Tower' (Tang)","a":"1208f408529132d0","b":"5f897e8053f8b3e2","e":"c891cb16b101ed8a","eb":"840a57eed573d7a1"},{"zh":"欲穷千里目，","py":"yù qióng qiān lǐ mù,","en":"To see a thousand miles further,","ic":"👀","ex":"唐·王之涣《登鹳雀楼》","exen":"Wang Zhihuan, 'Climbing Stork Tower' (Tang)","a":"a75ad69c722e1cc7","b":"5f897e8053f8b3e2","e":"3d0a3c5e02e5ac60","eb":"840a57eed573d7a1"},{"zh":"更上一层楼。","py":"gèng shàng yì céng lóu.","en":"Climb up one more storey.","ic":"🏯","ex":"唐·王之涣《登鹳雀楼》","exen":"Wang Zhihuan, 'Climbing Stork Tower' (Tang)","a":"047fc244c2511f38","b":"5f897e8053f8b3e2","e":"f8cafe00f81a6ba1","eb":"840a57eed573d7a1"},{"zh":"江南可采莲，","py":"jiāng nán kě cǎi lián,","en":"In Jiangnan we can pick lotus,","ic":"🪷","ex":"汉乐府《江南》","exen":"Han Yuefu folk song, 'South of the River' (Han)","a":"e069e3c25cc09871","b":"0f1fc6a11fd06bb2","e":"62e21301abf3bfeb","eb":"4ac4f3293f6a0037"},{"zh":"莲叶何田田。","py":"lián yè hé tián tián.","en":"How lush the lotus leaves are!","ic":"🍃","ex":"汉乐府《江南》","exen":"Han Yuefu folk song, 'South of the River' (Han)","a":"cf6a9fe26b53e01d","b":"0f1fc6a11fd06bb2","e":"7b494ad6a5cb42e2","eb":"4ac4f3293f6a0037"},{"zh":"鱼戏莲叶间。","py":"yú xì lián yè jiān.","en":"Fish play among the lotus leaves.","ic":"🐟","ex":"汉乐府《江南》","exen":"Han Yuefu folk song, 'South of the River' (Han)","a":"9b750abba91f4eac","b":"0f1fc6a11fd06bb2","e":"b6e815983f8da7ea","eb":"4ac4f3293f6a0037"},{"zh":"不知细叶谁裁出，","py":"bù zhī xì yè shuí cái chū,","en":"Who cut out these slender leaves, I wonder?","ic":"🌿","ex":"唐·贺知章《咏柳》","exen":"He Zhizhang, 'Ode to the Willow' (Tang)","a":"2f6f88b83be85af0","b":"c78cc31a2ff26148","e":"22c19b3fd61ae806","eb":"1df3a397a955ffe9"},{"zh":"二月春风似剪刀。","py":"èr yuè chūn fēng sì jiǎn dāo.","en":"The spring breeze of the second month is like scissors.","ic":"✂️","ex":"唐·贺知章《咏柳》","exen":"He Zhizhang, 'Ode to the Willow' (Tang)","a":"9aa0804e273dd205","b":"c78cc31a2ff26148","e":"2d578374f9e93319","eb":"1df3a397a955ffe9"},{"zh":"飞流直下三千尺，","py":"fēi liú zhí xià sān qiān chǐ,","en":"The torrent plunges three thousand feet,","ic":"🏔️","ex":"唐·李白《望庐山瀑布》","exen":"Li Bai, 'Viewing the Waterfall at Mount Lu' (Tang)","a":"a8a5ef73c56a9de1","b":"9f5aa9345fb37402","e":"c25a403f87ec9cff","eb":"5296236035b0fda2"},{"zh":"疑是银河落九天。","py":"yí shì yín hé luò jiǔ tiān.","en":"As if the Milky Way were falling from the heavens.","ic":"🌌","ex":"唐·李白《望庐山瀑布》","exen":"Li Bai, 'Viewing the Waterfall at Mount Lu' (Tang)","a":"d4d00eb3e37516ec","b":"9f5aa9345fb37402","e":"c64f00b115353654","eb":"5296236035b0fda2"},{"zh":"两个黄鹂鸣翠柳，","py":"liǎng gè huáng lí míng cuì liǔ,","en":"Two orioles sing in the green willows,","ic":"🐤","ex":"唐·杜甫《绝句》","exen":"Du Fu, 'Quatrain' (Tang)","a":"7fa5ccd12770bed6","b":"b9df9876396ae20d","e":"7b694b8422c7414d","eb":"05feec77b83d0f9b"},{"zh":"一行白鹭上青天。","py":"yì háng bái lù shàng qīng tiān.","en":"A line of white egrets rises into the blue sky.","ic":"🕊️","ex":"唐·杜甫《绝句》","exen":"Du Fu, 'Quatrain' (Tang)","a":"daf28ff94f0ace89","b":"b9df9876396ae20d","e":"24e36bff43539dae","eb":"05feec77b83d0f9b"},{"zh":"野火烧不尽，","py":"yě huǒ shāo bú jìn,","en":"Wildfires cannot burn it all away,","ic":"🔥","ex":"唐·白居易《赋得古原草送别》","exen":"Bai Juyi, 'Grass on the Ancient Plain' (Tang)","a":"9b589067bd8a4214","b":"f61c4c9cd0bf1d4f","e":"35b1e126d9529836"," <script>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const LISTEN_POOL=[
  {id:'hunt',zh:'听音寻宝',ic:'🎯'},
  {id:'bubble',zh:'戳泡泡',ic:'🎈'},

];
function ensureExtraState(){
  if(typeof S.gold!=='number'||isNaN(S.gold))S.gold=30;
  const td=ymd();

    const pick=LISTEN_POOL[(Math.random()*LISTEN_POOL.length)|0].id;
    S.daily={day:td,learn:0,listen:0,voice:0,trace:0,listenGame:pick,claimed:false,items:[]};

  if(!Array.isArray(S.daily.items))S.daily.items=[];

    S.daily.listenGame=LISTEN_POOL[(Math.random()*LISTEN_POOL.length)|0].id;
  }
  if(typeof S.daily.listen!=='number')S.daily.listen=0;

const BASES=DATA.audioBases;let abase=0;

function tts(text,lang){return new Promise(res=>{if(!window.speechSynthesis||!text)return res();const isEn=lang?/^en/i.test(lang):(!/[\u3400-\u9fff]/.test(text)&&/[a-zA-Z]/.test(text));const u=new SpeechSynthesisUtterance(text);u.lang=isEn?'en-US':'zh-CN';u.rate=S.settings.slow?(isEn?.68:.58):(isEn?.82:.74);u.pitch=isEn?1.02:1.02;
  const vs=speechSynthesis.getVoices();const v=isEn?(vs.find(v=>/Samantha|Karen|Moira|Aria|Ana/i.test(v.name))||vs.find(v=>/en[-_](AU|GB|US)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))):(vs.find(v=>/Xiaoxiao|Xiaoyi|Tingting|Ting-Ting|Meijia/i.test(v.name))||vs.find(v=>/zh[-_](CN|TW)/i.test(v.lang)));if(v)u.voice=v;let fin=false;const f=()=>{if(!fin){fin=true;res();}};u.onend=f;u.onerror=f;speechSynthesis.speak(u);setTimeout(f,1800+text.length*550);});}
function play(k,text,el){
  const tok=++playTok;try{player.pause();}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();
  setSpeaking(el);talk(true);
  return new Promise(res=>{
    let fin=false;const done=()=>{if(fin)return;fin=true;clearTimeout(guard);if(tok===playTok){setSpeaking(null);talk(false);}res();};
    const guard=setTimeout(done,15000);
    if(window.__fastPlay){setTimeout(done,5);return;}
    let tryIdx=abase;
    let tried=0;
    const attempt=()=>{
      if(tok!==playTok)return done();
      if(!k||tried>=BASES.length){tts(text).then(done);return;}
      const curBase=tryIdx%BASES.length;
      player.onended=done;
      player.oncanplay=player.onplaying=()=>{abase=curBase;};
      player.onerror=()=>{if(tok!==playTok)return done();tried++;tryIdx++;attempt();};
      player.src=clipUrl(k,curBase);const r=S.settings.slow?.72:.88;player.defaultPlaybackRate=r;player.playbackRate=r;
      try{player.preservesPitch=true;player.webkitPreservesPitch=true;}catch(e){}
      const p=player.play();if(p&&p.catch)p.catch(err=>{if(err&&err.name==='NotAllowedError')done();});
    };
    attempt();
  });
}

function getCharDna(ch){
  if(CHAR_DNA_DB[ch])return CHAR_DNA_DB[ch];
  const n=(window.HANZI_DATA&&window.HANZI_DATA[ch])?window.HANZI_DATA[ch][0].length:0;
  return ['汉字结构',`共 ${n||'?'} 笔 · 观察字形结构巧记`,'Structure'];
}
function charDnaHTML(it){
  const chars=hanOf(it.zh).slice(0,4);
  if(!chars.length)return '';
  const pills=chars.map(ch=>{
    const [rad,tip]=getCharDna(ch);
    return `<span class="dna-pill"><b>${ch}</b><span><em>${esc(rad)}</em> · ${esc(tip)}</span></span>`;
  }).join('');
  return `<div class="dna-box" id="dnaBox" title="点此重播笔顺与真人领读">
    <div class="dna-hdr"><span>🧬 字源魔法与部首巧记 · Character DNA</span><span>✨ 点我示范</span></div>
    <div class="dna-pills">${pills}</div>
  </div>`;
}

  }
  const badge=$('#cardLearnBadge');
  if(badge&&it){

    badge.style.background=done?'#DEF7EC':'#FEF3C7';

  }
  const nxt=$('#next');
  if(nxt&&it&&isCardLearnedToday(it)){
    nxt.style.boxShadow='0 0 0 4px rgba(16,185,129,.38)';
  }
  if(notify&&it){
    const s1=Math.min(3,(S.daily&&S.daily.learn)||0);

      }

function completeCurrentLearnCard(){
  if(!CUR.W||CUR.mode!=='learn')return;
  const it=CUR.W.items[CUR.idx];
  const wasNew=markLearned(it,true);
  const s1=Math.min(3,(S.daily&&S.daily.learn)||0);
  if(s1>=3&&(S.daily.listen||0)<1&&wasNew){
    later(()=>{if(CUR.mode==='learn')renderLearn(CUR.idx,true);},600);
    return;
  }
  stopAuto();SFX.flip();
  go(`#/w/${CUR.W.id}/learn/${(CUR.idx+1)%32}`);
}

/* ---------- 🎯 listening treasure hunt (1 → 2 → 3 targets) ---------- */
function gHunt(){
  const W=CUR.W;const plan=[1,1,2,2,3,3];frame('hunt',plan.length);gems(0);
  let r=0,score=0;const total=plan.reduce((a,b)=>a+b,0);const used=[];
  const round=()=>{
    if(r>=plan.length)return finish('hunt',score,total);stepTo(r);
    const n=plan[r];const tg=pickTargets(W,n,used);used.push(...tg);const opts=shuffle(tg.concat(distract(W,tg,n===1?2:n===2?2:3)));
    $('#gbody').innerHTML=`<div class="chests">${opts.map(it=>choiceHTML(it,'chest')).join('')}</div>`;
    setPrompt(n===1?'听一听，宝藏藏在哪个箱子里？':`按顺序找出 ${n} 个宝藏（第 1/${n} 个）！`);
    let pos=0,missed=false,isSpeaking=false,idleTimer=null;
    const armIdle=()=>{clearTimeout(idleTimer);if(pos<n&&!isSpeaking){idleTimer=later(()=>{if(pos<n&&!isSpeaking)sayRem(false);},5500);}};
    const sayRem=async(withIntro)=>{
      clearTimeout(idleTimer);
      const my=++seqTok;
      isSpeaking=true;
      if(withIntro&&pos===0){
        await play(P.find.a,P.find.zh,$('#gspk'));
        if(my!==seqTok){return;}
        if(pos===0)await sleep(240);
      }
      let k=pos;
      while(k<n){
        if(my!==seqTok||pos>=n)break;
        if(k<pos)k=pos;
        const cur=tg[k];
        await play(cur.a,cur.zh,$('#gspk'));
        if(my!==seqTok||pos>=n)break;
        k=Math.max(k+1,pos);

      if(my===seqTok){
        isSpeaking=false;

function gBubble(){

  const spawn=(force)=>{

      it=t;

      const aliveKeys=new Set(alive.map(b=>b.dataset.k));

    b.style.animationDuration=(7.5+Math.random()*3.5)+'s';

        later(()=>b.remove(),340);
        SFX.pop();gems(1);sayZh(it);
        if(roundPopped===0){recordCorrect(it);if(!missed)score++;missed=false;}
        roundPopped++;

          setPrompt(`太棒了！池子里还有 ${rem} 个「${curT.zh}」泡泡，把它们全戳破吧！`);
        }else{
          advance();
        }
      }else{
        SFX.buzz();recordWrong(curT);missed=true;
        b.style.filter='grayscale(.8) brightness(.9)';later(()=>{b.style.filter='';},500);
        later(()=>sayBi(curT),250);
      }
    };
  };
  const next=()=>{
    const t=tg[idx];if(!t)return;
    roundPopped=0;missed=false;
    setPrompt('戳破会说话的那个泡泡（有多个可以全戳破哦）！');stepTo(idx);

    const t=qs[i];const opts=shuffle([t].concat(distract(t.w,[t],3)));
    $('#mb').innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="spk sm" id="rvSpk">${icon('speaker')}</button><b style="font-size:18px">第 ${i+1}/${qs.length} 题：听一听，是哪一个？</b></div>

    const say=()=>sayZh(t,$('#rvSpk'));$('#rvSpk').onclick=()=>sayBi(t,$('#rvSpk'));setTimeout(say,250);let miss=false;
    $$('#mb .choice').forEach(el=>el.onclick=()=>{const it=KMAP[el.dataset.k];if(it===t){el.classList.add('good');SFX.ding();recordCorrect(t);if(!miss)ok++;i++;sayBi(t,$('#rvSpk'));setTimeout(ask,1300);}else{el.classList.add('bad');SFX.buzz();miss=true;setTimeout(()=>el.classList.remove('bad'),420);sayBi(t,$('#rvSpk'));}});};
  ask();}

/* ⚙️ settings popover */
function openSettings(btn){
  const ex=$('.settings');if(ex){ex.remove();return;}
  const p=document.createElement('div');p.className='settings';
  const row=(k,ic,t,sub)=>`<button class="tog" data-k="${k}">${icon(ic)}<span>${t}<small>${sub}</small></span><i class="sw ${S.settings[k]?'on':''}"></i></button>`;
  p.innerHTML=`<h3>设置 Settings</h3>${row('pinyin','pinyin','显示拼音','Show pinyin')}${row('english','abc','显示英文','Show English')}${row('slow','snail','慢速朗读','Slow voice')}${row('sfx','sparkle','音效','Sound effects')}
   <div class="tog" style="cursor:default">${icon(S.settings.mascot)}<span>小伙伴<small>Buddy</small></span></div>
   <div class="rowbtns" style="padding:0 10px 6px"><button class="pill ${S.settings.mascot==='panda'?'on':''}" data-m="panda">${icon('panda')} 汤圆</button><button class="pill ${S.settings.mascot==='dragon'?'on':''}" data-m="dragon">${icon('dragon')} 团团</button></div>`;
  document.body.appendChild(p);
  const r=btn.getBoundingClientRect();
  if(innerWidth>640){p.style.right=Math.max(10,innerWidth-r.right)+'px';p.style.top=Math.max(12,Math.min(r.bottom+12,innerHeight-p.offsetHeight-12))+'px';}
  else{p.style.top=Math.max(12,Math.min(r.bottom+8,innerHeight-p.offsetHeight-12))+'px';}
  $$('.tog[data-k]',p).forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.settings[k]=!S.settings[k];save();b.querySelector('.sw').classList.toggle('on',S.settings[k]);refreshView();});
  $$('[data-m]',p).forEach(b=>b.onclick=()=>{S.settings.mascot=b.dataset.m;save();p.remove();refreshView();});
  setTimeout(()=>document.addEventListener('pointerdown',function f(e){if(!p.contains(e.target)&&!e.target.closest('[data-act="settings"]')){p.remove();}document.removeEventListener('pointerdown',f);}),0);
}
function refreshView(){if(!$('#scene-world').classList.contains('hidden')&&CUR.mode==='learn'){stopAudio();cleanupGame();renderLearn(CUR.idx,true);}else if(!$('#scene-map').classList.contains('hidden'))showMap(DATA.levels[S.level].id);}

/* ---------- router + delegation ---------- */
function go(h){if(location.hash!==h)location.hash=h;else route();}
function route(){
  stopAudio();cleanupGame();closeModal();
  const p=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);
  if(p[0]==='selftest')return selftest();
  if(p[0]==='w'&&WMAP[p[1]])return openWorld(WMAP[p[1]],p[2]==='play'?'play':'learn',p[3]);
  CUR.W=null;showMap(p[0]==='map'?p[1]:null);
  if(p[2]==='stickers')openStickers();else if(p[2]==='review')openReview();else if(p[2]==='parent')openParent();else if(p[2]==='pro')openProModal();
}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a){const k=a.dataset.act;SFX.tap();
    if(k==='home')go('#/map/'+(CUR.W?CUR.W.level.id:DATA.levels[S.level].id));else if(k==='petroom')openPetRoom();else if(k==='pro')openProModal();else if(k==='stickers')openStickers();else if(k==='review')openReview();else if(k==='parent')openParent();else if(k==='settings')openSettings(a);return;}
  const lv=e.target.closest('[data-lv]');if(lv){SFX.tap();go('#/map/'+lv.dataset.lv);return;}
  const w=e.target.closest('.wcard');if(w){SFX.tap();const W=WMAP[w.dataset.w];if(W&&!isUnlocked(W)){openProModal(W);return;}go('#/w/'+w.dataset.w+'/learn/0');return;}
  const m=e.target.closest('#seg button');if(m&&CUR.W){SFX.tap();go('#/w/'+CUR.W.id+'/'+m.dataset.mode);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});

/* ---------- self-test (#/selftest) — used by the headless build verification ---------- */
async function selftest(){
  const out=[],bad=[];const real=play;window.__silent=true;const prevPro=S.pro;S.pro=true;
  let n=0;const keys=new Set();
  const badShapes=new Set(['🔴','🟠','🟡','🟢','🔵','🟣','🟤','⚫','⚪','🟥','🟧','🟨','🟩','🟦','🟪','🟫','⬛','⬜','🔘','🔺','🔻','🔸','🔹','🔶','🔷']);
  WORLDS.forEach(W=>{if(W.items.length!==32)bad.push(W.id+' has '+W.items.length);const z=new Set(W.items.map(i=>i.zh));if(z.size!==32)bad.push(W.id+' dup zh');const icSet=new Set(W.items.map(i=>i.ic));if(icSet.size!==32)bad.push(W.id+' dup icon ('+icSet.size+'/32)');W.items.forEach(it=>{n++;keys.add(it.a);if(!it.a||!it.b||!it.e||!it.eb)bad.push('noaudio '+it.k);if(badShapes.has(it.ic))bad.push('badShape '+it.k+' '+it.ic);if(hanOf(it.zh).length!==sylls(it.py).length)bad.push('pinyin '+it.k);hanOf(it.zh).forEach(ch=>{if(!window.HANZI_DATA||!window.HANZI_DATA[ch])bad.push('noStroke '+ch);});});});
  out.push('levels='+DATA.levels.length+' worlds='+WORLDS.length+' items='+n+' uniqueWordClips='+keys.size+' hanziStrokes='+Object.keys(window.HANZI_DATA||{}).length);
  for(const L of DATA.levels){showMap(L.id);if($$('.wcard').length!==L.worlds.length)bad.push('map '+L.id+' cards='+$$('.wcard').length);if(!$('#dailyBanner'))bad.push('no dailyBanner');}
  for(const W of WORLDS){openWorld(W,'learn',5);if(!$('.fcard .ruby')||!$('#spkEn'))bad.push('learn '+W.id);stopAudio();cleanupGame();}
  const W=WORLDS[0];
  for(const g of GAMES){try{openWorld(W,'play',g.id);await sleep(80);if(!$('#gbody')||!$('#gbody').innerHTML.trim())bad.push('game empty '+g.id);
      for(let k=0;k<14;k++){const els=$$('#gbody .choice:not(.used):not(.good), #gbody .gbub:not([data-dead]), #gbody .mcard:not(.up)');if(!els.length)break;els[(Math.random()*els.length)|0].click();await sleep(140);}
      if(g.id==='trace'){$('#tCheck').click();$('#tNext').click();$('#tDemo').click();$('#tEn').click();}
      if(g.id==='voice'){$('#vNext').click();$('#vEn').click();}
      out.push('game '+g.id+' clicked ok');}catch(e){bad.push('game '+g.id+' '+e.message);}stopAudio();cleanupGame();}
  try{openWorld(WORLDS[0],'learn',3);$('#spkEn').click();$('#exBox').click();$('#next').click();$('#slow').click();$('#rewrite').click();S.settings.slow=false;
      window.__fastPlay=true;openWorld(WORLDS[0],'learn',3);$('#auto').click();await sleep(3200);
      if(CUR.idx<=3)bad.push('autoPlay did not advance from 3, cur='+CUR.idx);
      else out.push('autoPlay advanced 3 -> '+CUR.idx);
      $('#auto').click();if(CUR.auto)bad.push('autoPlay did not pause');
      window.__fastPlay=false;}catch(e){bad.push('learn controls '+e.message);window.__fastPlay=false;}
  try{openStickers();if($$('#mb .stk svg.badge').length!==WORLDS.length)bad.push('stickers');closeModal();openReview();closeModal();openParent();openDash();if(!$('.kpis'))bad.push('dash');closeModal();}catch(e){bad.push('modal '+e.message);}
  S.pro=prevPro;save();
  bad.push(...ERRORS);
  const res=(bad.length?'SELFTEST FAIL\n'+bad.join('\n'):'SELFTEST PASS')+'\n'+out.join('\n');
  const o=$('#selftest-out');o.textContent=res;o.classList.remove('hidden');document.title=bad.length?'SELFTEST FAIL':'SELFTEST PASS';
}

/* ---------- boot ---------- */
if(/[?&]still/.test(location.search))document.documentElement.classList.add('still');
if(window.speechSynthesis)speechSynthesis.getVoices();
updateCounts();route();
</script>
