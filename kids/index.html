<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#A96D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="波波中文">
<meta name="description" content="波波中文 · Bobo Chinese — 4 levels, 52 storybook worlds, 1,664 Mandarin words and sentences with neural voice, 7 games, tracing, voice studio and parent insights.">
<title>波波中文 · Bobo Chinese</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root{
  --paper:#FAF6EE;--ink:#3A2A1C;--ink2:#6B5440;--ink3:#8A7660;--cream:#FFF9EE;
  --wood:#B57944;--wood-d:#6A3F1C;--gold:#E7B444;--gold-d:#A8761E;
  --coral:#E2583E;--jade:#1E9E6E;--indigo:#4553C4;--amber:#C9800A;
  --c:#5FA85A;--cd:#3B7A37;--cs:#E4F3DA;
  --ui:"PingFang SC","Hiragino Sans GB","SF Pro Rounded",ui-rounded,"Nunito","Microsoft YaHei",system-ui,sans-serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","PingFang SC",serif;
  --round:ui-rounded,"SF Pro Rounded","Avenir Next","Nunito","PingFang SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--ui);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none;
  background-color:#F1E7D6;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27260%27%20height%3D%27260%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.42%20%200%200%200%200%20.30%20%200%200%200%200%20.18%20%200%200%200%20.075%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E"),radial-gradient(1400px 700px at 50% -10%,#FFFAEE 0%,#F6EDDD 50%,#EADDC7 100%);
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid #4553C4;outline-offset:3px}
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:middle;flex:none}
.hidden{display:none!important}
.scene{animation:sceneIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes sceneIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- wood top bar ---------- */
.woodbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  margin:0 10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 12px;border-radius:0 0 26px 26px;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27600%27%20height%3D%27120%27%3E%3Cfilter%20id%3D%27w%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.004%20.09%27%20numOctaves%3D%273%27%20seed%3D%273%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.36%20%200%200%200%200%20.22%20%200%200%200%200%20.11%20%200%200%200%20.22%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23w%29%27%2F%3E%3C%2Fsvg%3E"),linear-gradient(#C99059,#A96D3A 58%,#8A5428);
  box-shadow:inset 0 2px 0 rgba(255,236,200,.45),inset 0 -3px 0 rgba(60,30,10,.35),0 6px 0 #5E3818,0 14px 26px rgba(45,30,15,.25)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .crest{width:54px;height:54px;flex:none;filter:drop-shadow(0 3px 2px rgba(40,20,5,.35))}
.brand h1{margin:0;font-family:var(--kai);font-size:27px;line-height:1.05;color:#FFF6E2;letter-spacing:1px;
  text-shadow:0 2px 0 #5E3818,0 3px 6px rgba(40,20,5,.35);white-space:nowrap}
.brand p{margin:2px 0 0;font:800 12px/1 var(--round);letter-spacing:2.2px;color:#FFE2A8;text-transform:uppercase;text-shadow:0 1px 0 #5E3818}
.spacer{flex:1}
.tools{display:flex;gap:10px}
.cbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;padding:6px 8px 7px;border-radius:18px;
  background:linear-gradient(#FFFCF4,#F0E1C4);color:#5A3A22;font-weight:800;font-size:12px;
  box-shadow:0 4px 0 #7E4F26,0 8px 14px rgba(40,20,5,.28),inset 0 1px 0 #fff;transition:transform .12s,box-shadow .12s}
.cbtn:hover{transform:translateY(-1px)}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7E4F26,0 3px 6px rgba(40,20,5,.25),inset 0 1px 0 #fff}
.cbtn svg.ic{width:30px;height:30px}
.cbtn .count{position:absolute;top:-7px;right:-5px;min-width:22px;background:#D9473B;color:#fff;border-radius:11px;font:800 11px/18px var(--round);padding:0 6px;box-shadow:0 2px 0 #8E2A22}
.cbtn.round{min-width:0;width:52px;height:52px;padding:0;justify-content:center;border-radius:50%}

/* ---------- map scene ---------- */
.islands{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1200px;margin:22px auto 6px;padding:0 18px}
.island-btn{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:24px;text-align:left;
  background:#F4E9D6;color:#5A3A22;border:2px solid #E2D0B2;box-shadow:0 5px 0 #CBB592,0 10px 18px rgba(45,30,15,.10);transition:transform .15s,box-shadow .15s,background .15s}
.island-btn .island{width:78px;height:58px;flex:none;object-fit:contain;filter:saturate(.7) brightness(.98)}
.island-btn b{display:block;font-size:17px;color:#4A3220;white-space:nowrap}
.island-btn small{display:block;color:#7A644C;font-weight:700;font-size:12px;margin-top:2px}
.island-btn .lv{display:inline-block;background:var(--lc);color:#fff;border-radius:8px;padding:1px 7px;font:900 12px/1.4 var(--round);margin-right:5px;vertical-align:2px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.island-btn .ibar{height:6px;border-radius:4px;background:#E3D3B8;margin-top:6px;overflow:hidden}
.island-btn .ibar i{display:block;height:100%;background:var(--lc);border-radius:4px}
.island-btn:hover{transform:translateY(-2px)}
.island-btn.active{background:#FFFDF7;border-color:var(--lc);box-shadow:0 6px 0 var(--lcd),0 14px 26px rgba(45,30,15,.18);transform:translateY(-3px)}
.island-btn.active .island{filter:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.lvhead{max-width:1200px;margin:18px auto 10px;padding:0 22px;display:flex;align-items:flex-end;gap:14px}
.lvhead h2{margin:0;font-family:var(--kai);font-size:34px;color:#3A2A1C;text-shadow:0 2px 0 #fff}
.lvhead .en{font:800 14px var(--round);color:#8A6A44;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}
.lvhead .ribbon{margin-left:auto;background:var(--cd);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2);margin-bottom:6px}
.wgrid{max-width:1200px;margin:0 auto;padding:8px 18px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:30px 22px}
.wcard{position:relative;display:block;text-align:left;border-radius:22px;padding:10px 10px 12px 20px;color:var(--ink);
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px),repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),linear-gradient(160deg,var(--m),var(--d));
  box-shadow:0 8px 0 var(--dd),0 14px 28px rgba(45,30,15,.16),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .16s cubic-bezier(.3,.7,.3,1.4),box-shadow .16s;animation:cardIn .5s both}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;border-radius:22px 0 0 22px;
  background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.04) 70%,rgba(255,255,255,.15)),var(--dd)}
.wcard::after{display:none}
.wcard.locked{filter:saturate(.55);opacity:.88}
.wcard.locked .wcover::after{content:"🔒 完整版解锁";position:absolute;inset:0;background:rgba(35,22,12,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:grid;place-items:center;color:#FFF8EA;font:900 16px var(--round);letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.wbadge-free{position:absolute;left:10px;top:10px;z-index:3;background:linear-gradient(#26B47F,#158058);color:#fff;font:900 11.5px/1 var(--round);padding:6px 10px;border-radius:10px;box-shadow:0 2px 0 #0D5238}
.wbadge-pro{position:absolute;left:10px;top:10px;z-index:3;background:linear-gradient(#5A4A3A,#3A2A1C);color:#FFE2A8;font:900 11.5px/1 var(--round);padding:6px 10px;border-radius:10px;box-shadow:0 2px 0 #1F150C}
.cbtn.pro-pill{background:linear-gradient(#FFE596,#E2A634);color:#4A2C0A;box-shadow:0 4px 0 #8A5A12,0 8px 14px rgba(40,20,5,.28),inset 0 1px 0 #FFF}
.wcard:hover{transform:translateY(-4px) rotate(-.4deg)}
.wcard:active{transform:translateY(5px);box-shadow:0 3px 0 var(--dd),0 6px 12px rgba(45,30,15,.16)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.wcover{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#fff;
  box-shadow:0 0 0 3px rgba(255,248,230,.95),0 3px 0 rgba(0,0,0,.18)}
.wcover svg.scenery,.wcover img.scenery{width:100%;height:100%;display:block;object-fit:cover}
.wcover .gloss{position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.35),transparent 38%);pointer-events:none}
.whero{position:absolute;left:12px;top:-42px;z-index:2;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:38px;
  background:radial-gradient(circle at 35% 30%,#fff,#F3E6CC);box-shadow:0 4px 0 var(--dd),0 7px 12px rgba(0,0,0,.22),inset 0 0 0 3px #E7B444}
.wnum{position:absolute;right:10px;top:10px;z-index:2;font:900 12px/1 var(--round);color:#5A3A12;padding:6px 9px;border-radius:10px;
  background:linear-gradient(#FFF0B8,#E2AE48);box-shadow:0 2px 0 #8A5A12,inset 0 1px 0 #fff}
.wplate{position:relative;margin-top:10px;background:linear-gradient(#FFFDF7,#FFF5E3);border-radius:15px;padding:28px 12px 11px;box-shadow:inset 0 2px 0 #fff,0 2px 0 rgba(0,0,0,.10)}
.wt{font-size:20px;font-weight:900;color:#33241A;line-height:1.15}
.we{font-size:12.5px;color:#7A644C;font-weight:700;margin-top:1px}
.wstars{position:absolute;right:10px;top:8px;display:flex;gap:1px}
.wstars svg{width:22px;height:22px}
.wprog{display:flex;align-items:center;gap:8px;margin-top:9px;font:800 12px var(--round);color:#6B5440}
.bar{flex:1;height:10px;border-radius:6px;background:#EADCC4;box-shadow:inset 0 1px 2px rgba(0,0,0,.18);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(#FFD884,#E3A53A);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.greet{display:flex;align-items:center;gap:6px;max-width:1200px;margin:0 auto;padding:0 22px}
.greet .mini{width:64px;height:64px}
.bubble{position:relative;background:#FFFDF7;border-radius:18px;padding:9px 14px;font-weight:800;color:#4A3220;box-shadow:0 3px 0 #E0CDAE,0 6px 14px rgba(45,30,15,.10)}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#FFFDF7;border-left:0}

/* ---------- world scene ---------- */
.backbtn{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 8px;border-radius:18px;font-weight:900;color:#FFF6E2;font-size:15px;
  background:linear-gradient(#8E5A2E,#6A3F1C);box-shadow:0 4px 0 #43260F,inset 0 1px 0 rgba(255,220,170,.35);white-space:nowrap}
.backbtn svg.ic{width:26px;height:26px}
.backbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #43260F}
.wtitle{display:flex;align-items:center;gap:10px;min-width:0}
.wtitle .bdg{width:46px;height:54px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.wtitle b{display:block;font-family:var(--kai);font-size:25px;color:#FFF6E2;text-shadow:0 2px 0 #5E3818;white-space:nowrap}
.wtitle small{display:block;font:800 11.5px var(--round);color:#FFE2A8;letter-spacing:1.4px;text-transform:uppercase}
.seg{display:flex;padding:4px;border-radius:20px;background:#55310F;box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 1px 0 rgba(255,220,170,.3)}
.seg button{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:16px;font-weight:900;font-size:15px;
  background:#FFF1DA;color:#5A3A22;margin:0 2px;transition:background .15s,transform .1s}
.seg button svg.ic{width:24px;height:24px}
.seg button:hover{background:#FFF8EA}
.seg button.on{background:var(--cd);color:#FFFFFF;text-shadow:0 1px 0 rgba(0,0,0,.35);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.stage{max-width:1220px;margin:18px auto 34px;padding:12px;border-radius:36px;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27600%27%20height%3D%27120%27%3E%3Cfilter%20id%3D%27w%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.004%20.09%27%20numOctaves%3D%273%27%20seed%3D%273%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.36%20%200%200%200%200%20.22%20%200%200%200%200%20.11%20%200%200%200%20.22%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23w%29%27%2F%3E%3C%2Fsvg%3E"),linear-gradient(#C99059,#8A5428);
  box-shadow:0 10px 0 #5E3818,0 24px 44px rgba(45,30,15,.26),inset 0 2px 0 rgba(255,236,200,.4)}
.stage-in{position:relative;border-radius:26px;padding:20px;min-height:600px;overflow:hidden;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27260%27%20height%3D%27260%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.42%20%200%200%200%200%20.30%20%200%200%200%200%20.18%20%200%200%200%20.075%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E"),radial-gradient(circle at 50% 18%,#FFFEF8,#FAF6EE 48%,#F1E6D3);
  box-shadow:inset 0 0 0 3px #E2AE48,inset 0 0 0 7px #FFF3D0,inset 0 0 0 8px #D9B56A,inset 0 8px 22px rgba(90,60,20,.18)}

/* ---------- flashcard theater ---------- */
.theater{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.fcard{position:relative;border-radius:30px;padding:24px 22px 20px;text-align:center;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27f%27%3E%3CfeTurbulence%20type%3D%27turbulence%27%20baseFrequency%3D%27.012%20.35%27%20numOctaves%3D%272%27%20seed%3D%277%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.55%20%200%200%200%200%20.40%20%200%200%200%200%20.22%20%200%200%200%20.05%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23f%29%27%2F%3E%3C%2Fsvg%3E"),linear-gradient(#FFFEFA,#FFF4E2);
  box-shadow:0 9px 0 #D6BE97,0 18px 32px rgba(60,40,15,.16),inset 0 0 0 2px #F0DDBB}
.fcard::after{display:none}
.fcard.flip{animation:cardFlip .35s ease}
@keyframes cardFlip{0%{transform:perspective(900px) rotateY(0)}50%{transform:perspective(900px) rotateY(8deg) scale(.98)}100%{transform:none}}
.illus{position:relative;width:210px;height:210px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:122px;line-height:1;
  background:radial-gradient(circle at 35% 30%,#FFFFFF,var(--soft) 72%);box-shadow:0 6px 0 var(--d),0 12px 22px rgba(0,0,0,.12),inset 0 0 0 6px rgba(255,255,255,.8)}
.illus span{animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(40,25,10,.22));display:grid;place-items:center}
svg.iic,img.iic{width:1.08em;height:1.08em;vertical-align:-0.12em;display:inline-block;overflow:visible;object-fit:contain}
.illus svg.iic,.illus img.iic{width:146px;height:146px;vertical-align:middle}
.illus::after{display:none}
@keyframes floaty{50%{transform:translateY(-8px) rotate(2deg)}}
.ruby{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 4px;margin-top:18px}
.ruby .ch{display:flex;flex-direction:column;align-items:center;min-width:.9em}
.ruby .py{font:800 24px/1.1 var(--round);letter-spacing:.3px;min-height:1.1em}
.ruby .hz{font-family:var(--kai);font-size:88px;line-height:1.05;color:#2B1D12}
.ruby .pu .hz{color:#8A7660}
.ruby.m .py{font-size:19px}.ruby.m .hz{font-size:60px}
.ruby.l .py{font-size:15px}.ruby.l .hz{font-size:42px}
.ruby.xl .py{font-size:13px}.ruby.xl .hz{font-size:34px}
.nopy .py{display:none}
.t1{color:#E2583E}.t2{color:#139466}.t3{color:#4553C4}.t4{color:#C9800A}.t0{color:#9A8A78}
.enpill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#2F3A66;color:#FFFFFF;padding:7px 18px;border-radius:999px;font:800 18px var(--round);box-shadow:0 3px 0 #1B2244;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}
.enpill svg{width:20px;height:20px;flex:none}
.enpill:active{transform:translateY(2px)}
.enpill.on{background:#1E6F9F;box-shadow:0 0 0 4px #FFE08A,0 4px 12px rgba(30,111,159,.45);transform:scale(1.06)}
.noen .enpill,.noen .ex-en,.noen .en-opt{display:none}
.spk{display:grid;place-items:center;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#FFFDF5,#F1DFBA);
  box-shadow:0 5px 0 #B0801F,0 10px 16px rgba(0,0,0,.18),inset 0 0 0 3px #E2AE48;transition:transform .1s}
.spk:active{transform:translateY(3px);box-shadow:0 2px 0 #B0801F,inset 0 0 0 3px #E2AE48}
.spk.big{position:absolute;top:18px;right:18px;width:76px;height:76px}.spk.big svg{width:48px;height:48px}
.spk.sm{width:48px;height:48px}.spk.sm svg{width:30px;height:30px}
.spk .wv{opacity:.35}
.spk.on .wv{animation:wave 1s infinite}
.spk.on .w2{animation-delay:.15s}.spk.on .w3{animation-delay:.3s}
@keyframes wave{0%,100%{opacity:.25}40%{opacity:1}}
.tonekey{display:none}
.tonekey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.expanel{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;text-align:left;background:#FFF8EA;box-shadow:inset 0 0 0 2px #EED9B5;cursor:pointer}
.ex-zh{font-size:21px;font-weight:800;color:#33241A;line-height:1.35;border-radius:8px;padding:2px 4px;transition:background .15s}
.ex-zh.on{background:#FFF0B8}
.ex-zh mark{background:linear-gradient(transparent 60%,#FFE08A 60%);color:inherit;padding:0 1px}
.ex-en{font-size:14px;color:#1E6F9F;font-weight:700;margin-top:2px;border-radius:8px;padding:2px 4px;transition:background .15s}
.ex-en.on{background:#DDF3FF;color:#0F4C75}
.side{display:flex;flex-direction:column;gap:16px}
.panel{border-radius:24px;padding:16px;background:linear-gradient(#FFFDF8,#FFF4E2);box-shadow:0 6px 0 #D9C39E,0 12px 22px rgba(60,40,15,.12),inset 0 0 0 2px #F1DFC0}
.panel h3{margin:0 0 10px;font-size:16px;color:#6A3F1C;display:flex;align-items:center;gap:8px}
.panel h3 small{font:700 11px var(--round);color:#8A7660;letter-spacing:1px;text-transform:uppercase}
.tzgrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tzg{position:relative;width:118px;height:118px;border:3px solid #D9473B;border-radius:6px;background:#FFFEFA url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cpath%20d%3D%27M50%200V100M0%2050H100%27%20stroke%3D%27%23E8A49B%27%20stroke-width%3D%27.8%27%20stroke-dasharray%3D%273%203%27%2F%3E%3Cpath%20d%3D%27M0%200L100%20100M100%200L0%20100%27%20stroke%3D%27%23F1C9C2%27%20stroke-width%3D%27.6%27%20stroke-dasharray%3D%272%203%27%2F%3E%3C%2Fsvg%3E") center/100% 100%;cursor:pointer}
.tzgrow.many .tzg{width:78px;height:78px}
.tzg svg{position:absolute;inset:0;width:100%;height:100%}
.tzg text{font-family:var(--kai);fill:#2B1D12}
.tzg.write text{fill:transparent;stroke:#2B1D12;stroke-width:1.1;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s ease forwards,fillin .7s 2s forwards}
.tzg .s-bg{fill:#E8D8BE}
.tzg .s-fg{fill:#2B1D12}
.tzg .s-med{fill:none;stroke:#D9473B;stroke-width:170;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:105;stroke-dashoffset:105}
.tzg.write .s-med{animation:tzgBrush .72s cubic-bezier(.25,.6,.35,1) forwards}
.tzg.write .s-fg{opacity:0;animation:strokeIn .76s ease forwards}
@keyframes tzgBrush{0%{stroke-dashoffset:105;stroke:#D9473B}78%{stroke-dashoffset:0;stroke:#D9473B}100%{stroke-dashoffset:0;stroke:#2B1D12}}
@keyframes strokeIn{0%,58%{opacity:0;fill:#D9473B}82%{opacity:1;fill:#D9473B}100%{opacity:1;fill:#2B1D12}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:#2B1D12}}
.tzg .pyc{position:absolute;top:-22px;left:0;right:0;text-align:center;font:800 15px var(--round)}
.tzgrow{padding-top:22px}
.coach{display:flex;align-items:flex-end;gap:8px}
.coach .mascot{width:120px;height:120px;flex:none}
.coach .bubble{flex:1;font-size:16px}
.coach .bubble::before{display:none}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:16px;font-weight:900;font-size:14px;
  background:linear-gradient(#FFFCF4,#F0E1C4);color:#5A3A22;box-shadow:0 4px 0 #B89466,0 7px 12px rgba(40,20,5,.12)}
.pill svg.ic{width:22px;height:22px}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #B89466}
.pill.on{background:linear-gradient(#3F8A5E,#2A6A45);color:#FFFFFF;box-shadow:0 4px 0 #1B4A2E;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pill.primary{background:linear-gradient(#EE6F52,#C9452D);color:#FFFFFF;box-shadow:0 4px 0 #8A2A18;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pill.primary svg.ic{width:18px;height:18px}
.pill[disabled]{background:#E6DAC6;color:#5E5040;box-shadow:0 3px 0 #C4B297;cursor:default;text-shadow:none}
.pill[disabled] svg.ic{filter:brightness(.42)}
.navrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px}
.arrow{width:66px;height:66px;transition:transform .1s}
.arrow svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(40,20,5,.22))}
.arrow:active{transform:translateY(3px) scale(.97)}
.counter{min-width:120px;text-align:center;font:900 22px var(--round);color:#5A3A22}
.counter small{display:block;font:700 12px var(--ui);color:#8A7660}
.film{display:flex;gap:10px;overflow-x:auto;padding:14px 4px 8px;margin-top:14px;scroll-snap-type:x proximity;scrollbar-width:thin}
.film button{flex:none;scroll-snap-align:center;width:74px;padding:7px 4px 6px;border-radius:16px;background:#FFF8EA;color:#4A3220;
  box-shadow:0 4px 0 #D9C39E,inset 0 0 0 2px #F0DDBB;position:relative;text-align:center}
.film button span{display:block;font-size:30px;line-height:1.1}
.film button b{display:block;font:800 13px var(--kai);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.film button.cur{background:var(--cd);color:#FFFFFF;box-shadow:0 4px 0 rgba(0,0,0,.35);transform:translateY(-3px)}
.film button.seen::after{content:"";position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:#E2AE48;box-shadow:0 0 0 2px #fff}
.film button.mast::after{background:#1E9E6E}

/* ---------- game picker ---------- */
.gpick-h{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.gpick-h h2{margin:0;font-family:var(--kai);font-size:30px;color:#3A2A1C}
.gpick-h p{margin:0;color:#7A644C;font-weight:700}
.gpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:20px}
.gtile{position:relative;text-align:left;border-radius:24px;padding:16px 16px 14px;color:#33241A;overflow:hidden;
  background:linear-gradient(#FFFEF9,#FFF2DC);box-shadow:0 7px 0 var(--gd),0 14px 24px rgba(60,40,15,.14),inset 0 0 0 2px #F1DFC0;transition:transform .15s}
.gtile::before{content:"";position:absolute;left:0;right:0;top:0;height:74px;background:linear-gradient(var(--g),var(--gd));opacity:.18}
.gtile:hover{transform:translateY(-4px) rotate(-.5deg)}
.gtile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gd)}
.gtile svg.ic{position:relative;width:72px;height:72px;filter:drop-shadow(0 5px 4px rgba(40,20,5,.2))}
.gtile b{display:block;font-size:20px;margin-top:8px}
.gtile small{display:block;color:#7A644C;font-weight:700;font-size:12.5px;margin-top:2px}
.gtile .gn{position:absolute;right:14px;top:14px;font:900 13px var(--round);color:#FFFFFF;background:var(--gd);border-radius:10px;padding:3px 8px}
.gtile .best{display:flex;gap:2px;margin-top:8px}.gtile .best svg{width:18px;height:18px}

/* ---------- game frame ---------- */
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ghead .gt{font-family:var(--kai);font-size:26px;font-weight:700;color:#3A2A1C}
.ghead .prompt{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:#FFFDF7;border-radius:18px;padding:8px 12px;font-weight:800;font-size:17px;color:#4A3220;box-shadow:0 3px 0 #E0CDAE}
.gems{display:flex;align-items:center;gap:6px;font:900 18px var(--round);color:#5A3A12;background:linear-gradient(#FFF6D2,#F2D088);padding:6px 12px;border-radius:14px;box-shadow:0 3px 0 #B0801F}
.gems svg{width:24px;height:24px}
.steps{display:flex;gap:6px}.steps i{width:12px;height:12px;border-radius:50%;background:#E6D6BC;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}.steps i.ok{background:#1E9E6E}.steps i.cur{background:#E2AE48}
.gbody{position:relative;min-height:470px}
.choice{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;padding:14px 10px;
  background:linear-gradient(#FFFFFF,#FFF4E2);color:#33241A;box-shadow:0 7px 0 #D3B98F,0 12px 20px rgba(60,40,15,.14),inset 0 0 0 2px #F1DFC0;transition:transform .12s}
.choice .e{font-size:64px;line-height:1.1;filter:drop-shadow(0 4px 3px rgba(40,25,10,.18))}
.choice .z{font:700 24px var(--kai);line-height:1.2;text-align:center}
.choice .z.long{font-size:17px}.choice .z.xlong{font-size:14px}
.choice.chest{background:linear-gradient(#FFF8EA,#F1DBB6)}
.choice:active{transform:translateY(4px)}
.choice.good{background:linear-gradient(#E9FFF2,#C9F2DA);box-shadow:0 7px 0 #1E9E6E,inset 0 0 0 3px #1E9E6E}
.choice.bad{animation:shake .4s}
.choice.dim{opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.done-card{text-align:center;padding:30px 10px}
.done-card h2{font-family:var(--kai);font-size:40px;margin:8px 0;color:#3A2A1C}
.done-card .stars3{display:flex;justify-content:center;gap:8px}.done-card .stars3 svg{width:64px;height:64px;animation:pop .5s both}
.done-card .stars3 svg:nth-child(2){animation-delay:.15s}.done-card .stars3 svg:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:none}}

/* treasure */
.chests{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-width:900px;margin:0 auto}
.chest{position:relative;height:190px;padding-top:62px}
.chest .lid{position:absolute;left:14%;right:14%;top:18px;height:46px;border-radius:40px 40px 6px 6px;background:linear-gradient(#9C6334,#6A3F1C);box-shadow:inset 0 0 0 4px #E2AE48;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.chest.open .lid{transform:rotateX(70deg) translateY(-18px)}
.chest.open::after{content:"";position:absolute;left:20%;right:20%;top:30px;height:60px;background:radial-gradient(#FFF3B0,transparent 70%);animation:glow 1s infinite alternate}
@keyframes glow{to{opacity:.4}}
/* bubbles */
.pond{position:relative;height:500px;border-radius:22px;overflow:hidden;background:linear-gradient(#DDF3FF,#F4FBFF 60%,#E8F6FF);box-shadow:inset 0 0 0 2px #CFE6F2}
.pond::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 60'><path d='M0 30 Q50 10 100 30 T200 30 T300 30 T400 30 V60 H0Z' fill='%23A8DDF2'/></svg>") bottom/400px 60px repeat-x;opacity:.8}
.gbub{position:absolute;bottom:-150px;width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.25) 22%,rgba(190,230,255,.28) 55%,rgba(247,166,216,.35) 80%,rgba(255,255,255,.7) 100%);
  box-shadow:inset -8px -10px 22px rgba(120,170,255,.35),inset 6px 8px 18px rgba(255,190,240,.35),0 8px 18px rgba(80,120,170,.18);animation:rise linear forwards;color:#2B3A55}
.gbub .e{font-size:50px;line-height:1}.gbub .z{font:700 18px/1.15 var(--kai);margin-top:2px;text-align:center;padding:0 6px}.gbub .z.long{font-size:14px}.gbub .z.xlong{font-size:11.5px}
.gbub.pop{animation:burst .35s forwards!important}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-700px)}}
@keyframes burst{to{transform:translateY(var(--y,0)) scale(1.6);opacity:0}}
/* train */
.track{position:relative;height:150px;margin:6px 0 20px;border-radius:18px;background:linear-gradient(#E6F4FF,#FFF6E6);overflow:hidden;box-shadow:inset 0 0 0 2px #EADCC4}
.rails{position:absolute;left:0;right:0;bottom:22px;height:10px;background:repeating-linear-gradient(90deg,#8A5A30 0 10px,transparent 10px 26px),linear-gradient(transparent 3px,#6B6B78 3px 6px,transparent 6px)}
.train{position:absolute;left:12px;bottom:28px;display:flex;align-items:flex-end;gap:4px;transition:transform 2.2s cubic-bezier(.5,0,.8,.5)}
.train.go{transform:translateX(1400px)}
.loco{width:120px;height:96px}
.car{width:92px;height:76px;border-radius:12px 12px 8px 8px;background:linear-gradient(var(--cc),var(--ccd));box-shadow:inset 0 0 0 3px rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;animation:pop .4s}
.car .e{font-size:34px;line-height:1}.car .z{font:700 14px var(--kai);color:#FFFFFF;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.car::before,.car::after{content:"";position:absolute;bottom:-12px;width:22px;height:22px;border-radius:50%;background:radial-gradient(#E2AE48 0 30%,#3A2A1C 32%)}
.car::before{left:10px}.car::after{right:10px}
.yard{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.yard .choice.used{visibility:hidden}
.smoke{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;opacity:.8;animation:puff 1.2s forwards}
@keyframes puff{to{transform:translate(-30px,-60px) scale(2.4);opacity:0}}
/* feed */
.feed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:center}
.pet{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
.pet .mascot{display:block}
.pet .mascot{width:min(330px,100%);height:auto}
.pet .bubble{display:inline-block;font-size:22px;margin-bottom:10px;padding:10px 18px}
.pet .bubble::before{left:50%;top:auto;bottom:-14px;margin:0 0 0 -8px;border:8px solid transparent;border-top-color:#FFFDF7;border-bottom:0}
.tummy{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;color:#6B5440;margin-top:4px}
.tummy .bar{max-width:220px}
.tummy .bar i{background:linear-gradient(#FFA7B5,#E86A84)}
.plates{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.plate .e{font-size:70px}
.plate::before{content:"";position:absolute;left:10%;right:10%;bottom:10px;height:14px;border-radius:50%;background:rgba(160,120,70,.18)}
.flyer{position:fixed;z-index:90;font-size:70px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.6,1),opacity .7s}
.heart{position:absolute;font-size:30px;animation:heartUp 1.2s forwards;pointer-events:none}
@keyframes heartUp{to{transform:translateY(-120px) scale(1.4);opacity:0}}
.petswitch{display:flex;gap:8px;justify-content:center;margin-top:10px}
/* mascot animation hooks */
.mascot .m-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mascot .m-tail{transform-box:fill-box;transform-origin:0% 90%;animation:tail 2.6s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(7deg)}}
.mascot .m-ear-l{transform-box:fill-box;transform-origin:80% 90%;animation:earL 5s infinite}
.mascot .m-ear-r{transform-box:fill-box;transform-origin:20% 90%;animation:earR 5s 1.3s infinite}
@keyframes earL{0%,88%,100%{transform:none}92%{transform:rotate(-12deg)}}
@keyframes earR{0%,88%,100%{transform:none}92%{transform:rotate(12deg)}}
.mascot .m-head{transform-box:fill-box;transform-origin:50% 90%;animation:headBob 3.6s ease-in-out infinite}
@keyframes headBob{50%{transform:rotate(-2deg) translateY(1px)}}
.mascot .m-pearl{animation:floaty 2.8s ease-in-out infinite}
.mascot .m-whisker{transform-box:fill-box;transform-origin:center;animation:whisk 3s ease-in-out infinite}
@keyframes whisk{50%{transform:scaleY(.85) translateY(3px)}}
.mascot .m-wing{transform-box:fill-box;animation:wing 1.4s ease-in-out infinite}
.mascot .m-wing-l{transform-origin:100% 80%}.mascot .m-wing-r{transform-origin:0% 80%;animation-delay:.1s}
@keyframes wing{50%{transform:rotate(-8deg)}}
.mascot .m-wing-r{animation-name:wingR}@keyframes wingR{50%{transform:rotate(8deg)}}
.mascot .m-mouth-o{opacity:0}
.mascot.talking .m-mouth-o,.mascot.chewing .m-mouth-o{animation:chew .32s infinite alternate}
.mascot.talking .m-mouth-c,.mascot.chewing .m-mouth-c{animation:chewc .32s infinite alternate}
@keyframes chew{from{opacity:0}to{opacity:1}}
@keyframes chewc{from{opacity:1}to{opacity:0}}
.mascot.happy{animation:hop .5s 2}
@keyframes hop{50%{transform:translateY(-16px)}}
.mascot.nope{animation:nope .5s}
@keyframes nope{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.mascot.happy .m-cheek{opacity:.9}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:700px;margin:0 auto;perspective:1000px}
.mcard{position:relative;aspect-ratio:3/3.3;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.mcard.up{transform:rotateY(180deg)}
.mcard>div{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mback{background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 6px,transparent 6px 14px),linear-gradient(145deg,#F6D27A,#D49A2E 55%,#A8761E);box-shadow:0 6px 0 #7E5612,0 10px 18px rgba(60,40,15,.2),inset 0 0 0 4px #FFF0B8,inset 0 0 0 7px #B8862B}
.mback svg{width:46%;height:46%;filter:drop-shadow(0 2px 0 #8A5A12)}
.mface{transform:rotateY(180deg);background:linear-gradient(#FFFFFF,#FFF4E2);box-shadow:0 6px 0 #D3B98F,inset 0 0 0 2px #F1DFC0;color:#2B1D12}
.mface .e{font-size:56px}.mface .z{font:700 30px/1.15 var(--kai);text-align:center;padding:0 6px}.mface .z.long{font-size:18px}.mface .z.xlong{font-size:14px}.mface .p{font:800 14px var(--round)}
.mcard.match .mface{box-shadow:0 6px 0 #1E9E6E,inset 0 0 0 3px #1E9E6E;background:linear-gradient(#F0FFF6,#D2F5E1)}
/* tracing */
.trace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.padwrap{position:relative;width:min(520px,100%);aspect-ratio:1;margin:0 auto;border-radius:26px;padding:14px;
  background:linear-gradient(#3E2A1C,#2A1B10);box-shadow:0 8px 0 #1A0F07,0 16px 30px rgba(0,0,0,.3),inset 0 0 0 3px #E2AE48}
.pad{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#FFF3D6,#F1D9A6 70%,#E5C384)}
.pad canvas,.pad svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad .grid{pointer-events:none}
.ring{position:relative;width:120px;height:120px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:900 28px var(--round);color:#5A3A22}
.charchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.charchips button{width:52px;height:52px;border-radius:14px;font:700 30px var(--kai);background:#FFF8EA;color:#33241A;box-shadow:0 4px 0 #D3B98F,inset 0 0 0 2px #F0DDBB}
.charchips button.cur{background:#6A3F1C;color:#FFF6E2;box-shadow:0 4px 0 #3A2010}
.charchips button.ok{box-shadow:0 4px 0 #1E9E6E,inset 0 0 0 3px #1E9E6E}
/* voice */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.wavebox{border-radius:18px;background:#2A1D14;padding:10px;box-shadow:inset 0 0 0 3px #6A4A2A,0 6px 0 #1A0F07}
.wavebox canvas{display:block;width:100%;height:110px}
.wavebox label{display:block;font:800 12px var(--round);letter-spacing:1px;color:#FFE2A8;margin:0 0 4px 4px}
.recbtn{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FF8E74,#D9473B);box-shadow:0 7px 0 #8E2A22,0 12px 20px rgba(0,0,0,.2),inset 0 0 0 4px #FFD2C4;flex:none}
.recbtn svg{width:56px;height:56px}
.recbtn.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 7px 0 #8E2A22,0 0 0 14px rgba(217,71,59,.25),inset 0 0 0 4px #FFD2C4}}
svg.star-ic{width:28px;height:28px;display:inline-block;vertical-align:middle;flex:none}
.vscore-stars{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:6px}
.vscore-stars svg{width:44px;height:44px;flex:none;animation:pop .45s both;filter:drop-shadow(0 3px 2px rgba(60,35,10,.22))}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(40,25,10,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}

.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 18px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27600%27%20height%3D%27120%27%3E%3Cfilter%20id%3D%27w%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.004%20.09%27%20numOctaves%3D%273%27%20seed%3D%273%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.36%20%200%200%200%200%20.22%20%200%200%200%200%20.11%20%200%200%200%20.22%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23w%29%27%2F%3E%3C%2Fsvg%3E"),linear-gradient(#B57944,#8A5428);color:#FFF6E2;box-shadow:0 4px 0 #5E3818}
.sheet-h h2{margin:0;font-family:var(--kai);font-size:26px;text-shadow:0 2px 0 #5E3818}
.sheet-h svg.ic{width:34px;height:34px}
.sheet-h .x{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#FFF3DE;box-shadow:0 3px 0 #5E3818}
.sheet-h .x svg{width:22px;height:22px}
.sheet-b{padding:18px 20px 24px}
.stk-lv{margin:6px 0 10px;font-family:var(--kai);font-size:22px;color:#4A3220}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;margin-bottom:16px}
.stk div{text-align:center;font-weight:800;font-size:13px;color:#4A3220}
.stk svg.badge{width:96px;height:112px}
.stk .off svg.badge{filter:grayscale(1) opacity(.42)}
.stk .off{color:#8A7A66}
.settings{position:fixed;z-index:85;top:84px;right:18px;width:300px;max-height:calc(100vh - 24px);overflow-y:auto;border-radius:24px;padding:14px;background:linear-gradient(#FFFDF7,#F7EEDD);box-shadow:0 8px 0 #8A5A30,0 20px 40px rgba(30,15,5,.3),inset 0 0 0 3px #E2AE48;animation:sheetIn .25s}
.settings h3{margin:2px 4px 10px;font-family:var(--kai);font-size:22px}
.tog{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:16px;text-align:left;font-weight:800;color:#4A3220}
.tog:hover{background:#FFF3DE}
.tog svg.ic{width:34px;height:34px}
.tog span{flex:1}.tog small{display:block;font-weight:600;color:#8A7660;font-size:12px}
.sw{width:52px;height:30px;border-radius:15px;background:#D8CBB6;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.2);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#1E9E6E}.sw.on::after{transform:translateX(22px)}
.gate{text-align:center;padding:10px}
.gate .q{font:900 44px var(--round);color:#3A2A1C;margin:10px 0 16px}
.gate .opts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.gate .opts button{width:88px;height:70px;border-radius:18px;font:900 28px var(--round);background:#FFF8EA;color:#33241A;box-shadow:0 5px 0 #D3B98F,inset 0 0 0 2px #F0DDBB}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{border-radius:20px;padding:14px;background:#FFFDF8;box-shadow:0 5px 0 #D9C39E,inset 0 0 0 2px #F1DFC0}
.kpi b{display:block;font:900 30px var(--round);color:#3A2A1C}.kpi span{font-weight:700;color:#7A644C;font-size:13px}
.dash2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:15px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.lvbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:800;color:#4A3220}.lvbar .bar{height:14px}
.mlist{display:flex;flex-wrap:wrap;gap:10px}
.mitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;background:#FFF8EA;color:#33241A;box-shadow:0 4px 0 #D3B98F,inset 0 0 0 2px #F0DDBB;font-weight:800}
.mitem .e{font-size:28px}.mitem .z{font:700 22px var(--kai)}.mitem i{font-style:normal;background:#D9473B;color:#fff;border-radius:9px;font:800 11px/18px var(--round);padding:0 6px}
.empty{text-align:center;color:#7A644C;font-weight:700;padding:30px}
.empty .mascot{width:150px;height:150px}

/* ---------- toast & confetti ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
.toast{position:fixed;z-index:96;right:22px;bottom:22px;display:flex;align-items:flex-end;gap:6px;animation:toastIn .45s cubic-bezier(.2,1.4,.4,1)}
.toast .mascot{width:110px;height:110px}
.toast .bubble{font-size:20px;margin-bottom:30px}
.toast .bubble::before{left:auto;right:-8px;border-right-color:transparent;border-left:8px solid #FFFDF7;border-right:0}
@keyframes toastIn{from{transform:translateY(140px)}}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .theater,.feed,.trace,.studio,.dash2{grid-template-columns:minmax(0,1fr)}
  .islands{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}

}

  .backbtn span{display:none}.backbtn{padding:8px}
  .illus{width:156px;height:156px;font-size:90px}

  .ruby.m .hz{font-size:46px}.ruby.l .hz{font-size:32px}.ruby.xl .hz{font-size:27px}
  .ruby.m .py{font-size:14px}.ruby.l .py{font-size:12px}.ruby.xl .py{font-size:11px}.ruby{gap:2px 1px}
  .enpill{font-size:15px;padding:6px 14px}.expanel{padding:10px}.ex-zh{font-size:18px}
  .spk.big{width:58px;height:58px;top:12px;right:12px}.spk.big svg{width:36px;height:36px}
  .tonekey{display:none}
  .arrow{width:54px;height:54px}
  .studio{gap:12px}

  .mem{grid-template-columns:repeat(3,1fr);gap:10px}

46e00c39ed2f"},{"zh":"别哭了，我陪你。","py":"bié kū le, wǒ péi nǐ.","en":"Don't cry, I'm here with you.","ic":"🫂","ex":"谢谢你，你真好。","exen":"Thank you, you're so kind.","a":"23ba6bd676a5804b","b":"4e34e7f19966d28c","e":"e463c8d61c6011bb","eb":"fd4e6df2befcd4ed"},{"zh":"我来帮你吧。","py":"wǒ lái bāng nǐ ba.","en":"Let me help you.","ic":"🤝","ex":"太好了，谢谢你！","exen":"Great, thank you!","a":"eb66b0042f6be3c6","b":"e924dde1a048af03","e":"c4e09b9621baca44","eb":"a9b9f1845e18529b"},{"zh":"我想你了。","py":"wǒ xiǎng nǐ le.","en":"I miss you.","ic":"💌","ex":"我也想你，宝贝！","exen":"I miss you too, sweetie!","a":"5f11d69dc2890a1b","b":"fe53e55f39e137b6","e":"d0d8b35c65a86f9c","eb":"69d8812579318622"},{"zh":"我爱你！","py":"wǒ ài nǐ!","en":"I love you!","ic":"❤️","ex":"我也爱你！","exen":"I love you too!","a":"e6f874a2d62ca2ff","b":"be1ec79172ed1a28","e":"72f61f056d11974c","eb":"7719fb4306a22f98"},{"zh":"我好紧张。","py":"wǒ hǎo jǐn zhāng.","en":"I'm so nervous.","ic":"😬","ex":"没关系，你准备得很好。","exen":"It's okay, you're well prepared.","a":"10ea88f7c039a319","b":"94a8fc02dde8dc53","e":"ee3ede4fe70f2e45","eb":"cc16a7da04eff62c"},{"zh":"我有点害羞。","py":"wǒ yǒu diǎn hài xiū.","en":"I'm a bit shy.","ic":"☺️","ex":"慢慢来，不着急。","exen":"Take your time, there's no rush.","a":"636ab2169a5e291b","b":"e5a7645e9401c7d1","e":"5d92350f2255eed6","eb":"ac136b95060a3996"},{"zh":"我好无聊啊。","py":"wǒ hǎo wú liáo a.","en":"I'm so bored.","ic":"😑","ex":"我们一起画画吧！","exen":"Let's draw together!","a":"8fb3da1567df5778","b":"6e127a31981650ce","e":"26b5a925d4766187","eb":"389d0b8510cd4e29"},{"zh":"我真为你高兴！","py":"wǒ zhēn wèi nǐ gāo xìng!","en":"I'm so happy for you!","ic":"🥳","ex":"谢谢，我们一起庆祝！","exen":"Thanks, let's celebrate together!","a":"1b3c9d9d5a5f28a8","b":"cc6c0bc3b2f08843","e":"9ff64f31978941fa","eb":"bb98bc67cf2b086c"},{"zh":"你一定很疼吧？","py":"nǐ yí dìng hěn téng ba?","en":"That must really hurt.","ic":"🤕","ex":"有一点，吹一吹就好了。","exen":"A little, a gentle blow will help.","a":"a4fd608986b6a614","b":"2000fdc1ce2a4114","e":"6c92814650b50053","eb":"b2ff0786ee4d4a5d"},{"zh":"没事的，下次会更好。","py":"méi shì de, xià cì huì gèng hǎo.","en":"It's okay, next time will be better.","ic":"🌈","ex":"嗯，我会继续努力！","exen":"Yes, I'll keep trying!","a":"bac3e322c2d4dad1","b":"0388e341e7addfe1","e":"2d83cd05770edecd","eb":"13291dc84d1ab203"},{"zh":"我能理解你的感受。","py":"wǒ néng lǐ jiě nǐ de gǎn shòu.","en":"I understand how you feel.","ic":"💞","ex":"谢谢你懂我。","exen":"Thanks for understanding me.","a":"7f3ab0b5108c915b","b":"b9cfee43792108f4","e":"659888459f3c213e","eb":"859eaf1b3ee78006"},{"zh":"你真勇敢！","py":"nǐ zhēn yǒng gǎn!","en":"You're so brave!","ic":"🦁","ex":"我一点也不怕了！","exen":"I'm not scared at all now!","a":"43d8e960277e05d5","b":"117d6a70dfdbf973","e":"ab3048c25065e23f","eb":"55dd2f7fdcb702ca"},{"zh":"我很失望。","py":"wǒ hěn shī wàng.","en":"I'm disappointed.","ic":"😞","ex":"下次我们再试试。","exen":"Let's try again next time.","a":"d837ef44f62547bf","b":"a7157d23f0c596d0","e":"606ced88111caeac","eb":"013026af26f8c34a"},{"zh":"我觉得很委屈。","py":"wǒ jué de hěn wěi qu.","en":"I feel treated unfairly.","ic":"🥺","ex":"告诉我发生了什么。","exen":"Tell me what happened.","a":"79b3bc0ae944b85d","b":"40d58acedbc4eed5","e":"823c5065ca692a33","eb":"f2d6e507d6e6e7d7"},{"zh":"我好激动啊！","py":"wǒ hǎo jī dòng a!","en":"I'm so excited!","ic":"🤩","ex":"是什么好消息呀？","exen":"What's the good news?","a":"b92bf0dbeb4e499f","b":"ff9c711e7ed82d1c","e":"72bdef0beb647df0","eb":"b4f629c9e7bb4337"},{"zh":"抱抱你，别伤心。","py":"bào bao nǐ, bié shāng xīn.","en":"Here's a hug, don't be sad.","ic":"🤗","ex":"有你在，我好多了。","exen":"With you here, I feel much better.","a":"2e8e4d7fd1b5ece5","b":"81ef4480c8f6f4d8","e":"adbb24145d0745d6","eb":"88cd6fadd8ad2674"},{"zh":"你需要帮忙吗？","py":"nǐ xū yào bāng máng ma?","en":"Do you need help?","ic":"🙋","ex":"要，请帮我拿一下。","exen":"Yes, please hold this for me.","a":"cfd84322e6cb76a5","b":"0cd99a7720b7097d","e":"d677ed50892c6252","eb":"afbbaf34241658c9"},{"zh":"对不起，我不是故意的。","py":"duì bu qǐ, wǒ bú shì gù yì de.","en":"Sorry, I didn't mean to.","ic":"🙇","ex":"我知道，没关系。","exen":"I know, it's okay.","a":"6868b59d5b0b3c8a","b":"17c66bbd08f3ea42","e":"d35f91db575a5db5","eb":"4583fe9acfe9b1e1"},{"zh":"我们和好吧。","py":"wǒ men hé hǎo ba.","en":"Let's make up.","ic":"🕊️","ex":"好呀，我们还是好朋友！","exen":"Sure, we're still good friends!","a":"85884d135894c6bf","b":"af0ba4bd6640dc38","e":"431df54a38f481b0","eb":"1398e1555fd90c76"},{"zh":"你别担心。","py":"nǐ bié dān xīn.","en":"Don't worry.","ic":"☀️","ex":"有你这句话，我放心了。","exen":"Hearing that, I feel better.","a":"76d51bc00538236f","b":"17af6ad5cec6496a","e":"bb9bfab72c6a483a","eb":"2cbf0514b7d9b0c5"},{"zh":"我心里暖暖的。","py":"wǒ xīn lǐ nuǎn nuǎn de.","en":"I feel warm inside.","ic":"🥰","ex":"因为你关心我呀。","exen":"Because you care about me.","a":"8e1d455f71367c63","b":"79c74baa8149d741","e":"2bdf6e0e2e7ac9d6","eb":"9d830a97b9549395"},{"zh":"我累了，想休息。","py":"wǒ lèi le, xiǎng xiū xi.","en":"I'm tired, I want to rest.","ic":"😴","ex":"那就躺一会儿吧。","exen":"Then lie down for a little while.","a":"02dc0206d47137d2","b":"9c597514148c892e","e":"39f5b8642fb01bc3","eb":"cef436295af0064f"},{"zh":"我好想哭。","py":"wǒ hǎo xiǎng kū.","en":"I feel like crying.","ic":"😭","ex":"想哭就哭吧，我陪着你。","exen":"It's okay to cry, I'm with you.","a":"d7ff011814d31db4","b":"a79cfccdd031240e","e":"c7c29d4633c57f72","eb":"6bb6f8f743045a5d"},{"zh":"你笑起来真好看！","py":"nǐ xiào qǐ lai zhēn hǎo kàn!","en":"You look lovely when you smile!","ic":"😊","ex":"谢谢，你也是！","exen":"Thanks, so do you!","a":"6f17d0cebc501423","b":"b4c017bdc498bb5e","e":"9b841bcb16eeaab9","eb":"116ffe40de5bacc8"},{"zh":"我们一起想办法。","py":"wǒ men yì qǐ xiǎng bàn fǎ.","en":"Let's work it out together.","ic":"💡","ex":"好主意，人多力量大！","exen":"Good idea, many hands make light work!","a":"7b7a14586860ac12","b":"59f133a982f90977","e":"1e4b95f858c08f32","eb":"4cfb4dcbbd943b7f"},{"zh":"谢谢你关心我。","py":"xiè xie nǐ guān xīn wǒ.","en":"Thanks for caring about me.","ic":"💝","ex":"因为你是我的好朋友。","exen":"Because you're my good friend.","a":"5f6fb66c5f595d11","b":"f7a1dd7bac665454","e":"ef9fc85f97d62579","eb":"f77ef5c3746e42e6"}]},{"id":"L4 172","e":"e11eec0f3d1b8374","eb":"52de440ddd93197a"},{"zh":"系好安全带。","py":"jì hǎo ān quán dài.","en":"Buckle up your seatbelt.","ic":"💺","ex":"咔嗒一声，系好了！","exen":"Click — all buckled up!","a":"b11d737776e3bed8","b":"7f3972d35b63686f","e":"7b03d9014ee6ff05","eb":"bc66c4a97a639a2a"},{"zh":"我们到了吗？","py":"wǒ men dào le ma?","en":"Are we there yet?","ic":"🚗","ex":"快了，再等十分钟。","exen":"Almost, just ten more minutes.","a":"83aa39ab3346a473","b":"ca2c2b7b1f32957c","e":"77ecb0b424defcfb","eb":"4d3bd8aeb1eeb7f8"},{"zh":"我想看窗外。","py":"wǒ xiǎng kàn chuāng wài.","en":"I want to look out the window.","ic":"🪟","ex":"窗外有好多云朵。","exen":"There are lots of clouds outside.","a":"7fa2cc04922d6bbf","b":"b4ba3f401033c4d4","e":"03e2ecd8e2c8db41","eb":"d611af5e985cf190"},{"zh":"我们去坐火车。","py":"wǒ men qù zuò huǒ chē.","en":"Let's take the train.","ic":"🚆","ex":"刷卡上车吧。","exen":"Tap on and hop on board.","a":"2e8e0edcbea2e479","b":"3031a471fa5af108","e":"946b5eede1049bc9","eb":"3755febd32f4c32a"},{"zh":"公交车来了！","py":"gōng jiāo chē lái le!","en":"The bus is here!","ic":"🚌","ex":"排好队，一个一个上。","exen":"Line up and get on one by one.","a":"2dbe027ba87a1145","b":"634327cf99bcf666","e":"8cd57b5715cbbb29","eb":"acd3a612fbba1f5b"},{"zh":"我们去海边玩。","py":"wǒ men qù hǎi biān wán.","en":"We're going to the beach.","ic":"🏖️","ex":"别忘了带泳衣和帽子。","exen":"Don't forget your swimmers and hat.","a":"14e30a21090c8275","b":"5856e874b39a81bb","e":"b94bd4853b02a6fc","eb":"d8e015ed607fd550"},{"zh":"我晕车了。","py":"wǒ yùn chē le.","en":"I feel carsick.","ic":"🤢","ex":"打开车窗透透气。","exen":"Open the window for some fresh air.","a":"076d1e7fddaadfb0","b":"a92fe83e837bcd00","e":"cd3ff45ee3a72fb1","eb":"cd96d28356ea5080"},{"zh":"带上地图吧。","py":"dài shàng dì tú ba.","en":"Let's bring the map.","ic":"🗺️","ex":"我们来找一找路线。","exen":"Let's find our route.","a":"c6e6a7c311af071a","b":"a9103bcfecf1cf9d","e":"869229822b4b9f06","eb":"82f6b836d90f4945"},{"zh":"我迷路了。","py":"wǒ mí lù le.","en":"I'm lost.","ic":"😟","ex":"别慌，找警察叔叔帮忙。","exen":"Don't panic, ask a police officer for help.","a":"10e505ace81813cc","b":"b1e851541ac9e72b","e":"c981b0ccd0e7c8b5","eb":"d505120545b1fcf2"},{"zh":"这是哪里？","py":"zhè shì nǎ lǐ?","en":"Where are we?","ic":"🧭","ex":"这里是悉尼歌剧院。","exen":"This is the Sydney Opera House.","a":"7c63350ec6ce95f5","b":"abc4aa6fe3f43801","e":"670f07254a76b46d","eb":"e296684915a7e7d2"},{"zh":"我们拍张照片吧！","py":"wǒ men pāi zhāng zhào piàn ba!","en":"Let's take a photo!","ic":"📸","ex":"一二三，茄子！","exen":"One, two, three, cheese!","a":"880c1abd2c7cc3eb","b":"4d3d60c7e75d1857","e":"99183a1814de8a62","eb":"5bfad473af36bb4f"},{"zh":"我要排队。","py":"wǒ yào pái duì.","en":"I'll wait in line.","ic":"🧍","ex":"不插队，真文明！","exen":"No pushing in — well done!","a":"7a2f6b1af6bfc55c","b":"7c98ef89073cfd29","e":"a85f1b131a437b70","eb":"b0bba7e049784e45"},{"zh":"请问，几点出发？","py":"qǐng wèn, jǐ diǎn chū fā?","en":"Excuse me, what time do we leave?","ic":"🕘","ex":"早上九点出发。","exen":"We leave at nine in the morning.","a":"bcde113d677aa32f","b":"0b39f3b8a7c3d40f","e":"c5031ae7fed8cee2","eb":"a427ea536b9a2697"},{"zh":"我们住酒店。","py":"wǒ men zhù jiǔ diàn.","en":"We're staying at a hotel.","ic":"🏨","ex":"房间在八楼。","exen":"Our room is on the eighth floor.","a":"fbd35175218dbc09","b":"00caba3070d4d506","e":"d6322a94c6e7973a","eb":"96704c3d1af65ccb"},{"zh":"我的行李箱在这里。","py":"wǒ de xíng li xiāng zài zhè lǐ.","en":"My suitcase is here.","ic":"🧳","ex":"自己的箱子自己拉。","exen":"Pull your own suitcase.","a":"09f5b564ee7e6782","b":"1bf126b639645df8","e":"0c82ea577390382c","eb":"c37081009f020f15"},{"zh":"我们去动物园。","py":"wǒ men qù dòng wù yuán.","en":"We're going to the zoo.","ic":"🦘","ex":"可以看到袋鼠和考拉！","exen":"We can see kangaroos and koalas!","a":"10259a42be403e53","b":"e314e7cd1424c101","e":"32e63ba403c01da2","eb":"1ea7987b033b55c8"},{"zh":"我想坐渡轮。","py":"wǒ xiǎng zuò dù lún.","en":"I want to ride the ferry.","ic":"⛴️","ex":"坐渡轮看海港大桥。","exen":"Let's take the ferry to see the Harbour Bridge.","a":"f732d5485a9c298a","b":"135f9a79562be1b3","e":"ec1f0f594260bb78","eb":"1ec67ffb92c365c9"},{"zh":"这条路对吗？","py":"zhè tiáo lù duì ma?","en":"Is this the right way?","ic":"🛣️","ex":"对，就在前面。","exen":"Yes, it's just ahead.","a":"de424db2214a7029","b":"eb07854a17497bd1","e":"20b56fdd0b66aa18","eb":"0e069b07358e647e"},{"zh":"我们快迟到了！","py":"wǒ men kuài chí dào le!","en":"We're nearly late!","ic":"🏃","ex":"别急，还来得及。","exen":"Don't worry, we still have time.","a":"ec245514581c9542","b":"8a1d50223db38539","e":"b68945fc692b0191","eb":"4bf5b3adec11bed3"},{"zh":"请问，这车去市中心吗？","py":"qǐng wèn, zhè chē qù shì zhōng xīn ma?","en":"Excuse me, does this go to the city?","ic":"🏙️","ex":"去的，请上车。","exen":"Yes, please hop on.","a":"79722fdbee97d2ab","b":"a2f66c9973a6be3d","e":"514a52a35cc604f1","eb":"75a181731e22d374"},{"zh":"下一站是哪里？","py":"xià yí zhàn shì nǎ lǐ?","en":"What's the next stop?","ic":"🚏","ex":"下一站是中央车站。","exen":"The next stop is Central Station.","a":"b030c18c6933a7eb","b":"920b9aa211db0464","e":"a23b8f7486b259bc","eb":"15b69a25043cff52"},{"zh":"我们回家吧。","py":"wǒ men huí jiā ba.","en":"Let's go home.","ic":"🏡","ex":"今天玩得真开心！","exen":"Today was so much fun!","a":"f447fabc057acc99","b":"e98f5f1cf9209e58","e":"2805f82edffd5b1b","eb":"4b88198fa8435459"},{"zh":"外面下雨了，带伞。","py":"wài miàn xià yǔ le, dài sǎn.","en":"It's raining outside, bring an umbrella.","ic":"☔","ex":"雨伞放在门口。","exen":"The umbrella is by the door.","a":"4f87811ab93ff595","b":"9903ac55852a6a2b","e":"49612476582ecad3","eb":"7ccf85576a7106ad"},{"zh":"我们去露营吧！","py":"wǒ men qù lù yíng ba!","en":"Let's go camping!","ic":"⛺","ex":"晚上可以看星星。","exen":"We can look at the stars at night.","a":"39d444ee4c2390c2","b":"10a62fa7c904b0d6","e":"14114c14689613a0","eb":"5af329300452b29c"},{"zh":"牵好我的手。","py":"qiān hǎo wǒ de shǒu.","en":"Hold my hand tight.","ic":"✋","ex":"人多，别走散了。","exen":"It's crowded, don't get separated.","a":"b30eadf4784caf78","b":"e91c5fe7d71be2dc","e":"87f8cfab9bb9567b","eb":"281b3beb85e70303"}]},{"id":"L4-social","cat":"social","zh":"交朋友与游乐场对话","en":"Playground Social","emoji":"🛝","pal":{ ":"One at a time, no pushing.","a":"f9d9bfe8ce4d5b24","b":"015e4336775d1f17","e":"93eff91f835c063f","eb":"74cd810be15e51e8"},{"zh":"你愿意做我的朋友吗？","py":"nǐ yuàn yì zuò wǒ de péng you ma?","en":"Will you be my friend?","ic":"💛","ex":"愿意！我们是好朋友。","exen":"Yes! We're good friends.","a":"41861531bbe6985e","b":"e7f7d36d7798f4b0","e":"51a6c23825ce5a5d","eb":"e0160b7611083609"},{"zh":"我把玩具分给你。","py":"wǒ bǎ wán jù fēn gěi nǐ.","en":"I'll share my toy with you.","ic":"🧸","ex":"谢谢你，你真大方！","exen":"Thanks, you're so generous!","a":"99dc5a27d4161c17","b":"f098c535d79d36f9","e":"a75cb5930d5602e7","eb":"412bc075cac36722"},{"zh":"能借我玩一下吗？","py":"néng jiè wǒ wán yí xià ma?","en":"Can I borrow it for a bit?","ic":"🪀","ex":"可以，玩完记得还我。","exen":"Sure, give it back when you're done.","a":"f86de75471d006ef","b":"4c7c030af3c2e85c","e":"5b8ddff7f15f0c9b","eb":"8ceea1d0fb2c8d9b"},{"zh":"我们玩捉迷藏吧！","py":"wǒ men wán zhuō mí cáng ba!","en":"Let's play hide-and-seek!","ic":"🙈","ex":"好，我来数到十！","exen":"Okay, I'll count to ten!","a":"1ba899f8737ff113","b":"5e75fd4b5a99dfe9","e":"d6cfc3da0f37dd25","eb":"b4fd469e23bf5945"},{"zh":"你来抓我呀！","py":"nǐ lái zhuā wǒ ya!","en":"Come and catch me!","ic":"🤸","ex":"我来了，快跑！","exen":"Here I come, run!","a":"77d7c44a60d8a2f6","b":"a4e6fef4b188aa9f","e":"b4b429222f5d99d4","eb":"6e02fa4299543bab"},{"zh":"请不要推我。","py":"qǐng bú yào tuī wǒ.","en":"Please don't push me.","ic":"✋","ex":"对不起，我会小心的。","exen":"Sorry, I'll be careful.","a":"9d79756705683e26","b":"d39c4807e7cb8a49","e":"be08098afc10d2c6","eb":"ec15a253b4200bc0"},{"zh":"我们一起堆沙堡。","py":"wǒ men yì qǐ duī shā bǎo.","en":"Let's build a sandcastle together.","ic":"🏰","ex":"我去装一桶沙子。","exen":"I'll fill a bucket with sand.","a":"37f0e524449158e0","b":"5200e1f650a32bdb","e":"56f19a99440ad640","eb":"82ef1fb21968cd1c"},{"zh":"你好厉害呀！","py":"nǐ hǎo lì hai ya!","en":"You're awesome!","ic":"🌟","ex":"谢谢，你也很棒！","exen":"Thanks, you're great too!","a":"fd32dc1dabe6c077","b":"0b5b169d178d9151","e":"bec551a078051874","eb":"a3ff1d0710bc3485"},{"zh":"我们玩老鹰捉小鸡。","py":"wǒ men wán lǎo yīng zhuō xiǎo jī.","en":"Let's play Eagle Catches Chicks.","ic":"🦅","ex":"我当母鸡保护你们！","exen":"I'll be the mother hen and protect you!","a":"833fb218c0e92b12","b":"3cbdd7482a60c678","e":"6222543aea61aaae","eb":"ba814e6af5c51592"},{"zh":"明天还来玩吗？","py":"míng tiān hái lái wán ma?","en":"Will you come and play tomorrow?","ic":"📅","ex":"来！我们明天见。","exen":"Yes! See you tomorrow.","a":"40686c335d3b83ca","b":"1f2d80cbff6c8f7d","e":"a31db9fd69730ed2","eb":"4ae3b668840ba0e6"},{"zh":"我们来跳绳吧。","py":"wǒ men lái tiào shéng ba.","en":"Let's skip rope.","ic":"🪢","ex":"我能连跳二十下！","exen":"I can do twenty in a row!","a":"fbe49e3acca4fed3","b":"6f2b23e45df382a7","e":"cf6a64e620b335b8","eb":"95d3bbd4d77a2d2c"},{"zh":"我们拍皮球。","py":"wǒ men pāi pí qiú.","en":"Let's bounce the ball.","ic":"🏀","ex":"一二三四五，拍得真稳！","exen":"One, two, three, four, five — so steady!","a":"a7845299282bfca4","b":"e973f64c6342a34e","e":"4582501dd2446c08","eb":"d78f8ad435a3ce8c"},{"zh":"把球传给我！","py":"bǎ qiú chuán gěi wǒ!","en":"Pass me the ball!","ic":"⚽","ex":"接住！好球！","exen":"Catch! Nice one!","a":"25296768bf331835","b":"815eb6a9ed8d32d0","e":"b9398b06b7a18b1d","eb":"00a94ff92e64dffd"},{"zh":"别着急，排队玩。","py":"bié zháo jí, pái duì wán.","en":"No rush, line up to play.","ic":"🚶","ex":"好，我排在你后面。","exen":"Okay, I'll line up behind you.","a":"b19adbd38e39e10c","b":"193c5844dd1419c4","e":"c83cee213dbaee27","eb":"655da1cf3c95d15d"},{"zh":"你摔倒了吗？","py":"nǐ shuāi dǎo le ma?","en":"Did you fall over?","ic":"🩹","ex":"我没事，拉我起来吧。","exen":"I'm okay, help me up.","a":"1212d09e53383c84","b":"d9cc51855349e043","e":"522f7d0edd672b37","eb":"51fe4c2f51046133"},{"zh":"我们玩石头剪刀布！","py":"wǒ men wán shí tou jiǎn dāo bù!","en":"Let's play rock-paper-scissors!","ic":"✊","ex":"我出布，你输啦！","exen":"I picked paper, you lose!","a":"18e2b17c927016cf","b":"ff4442cb3c23f09f","e":"0629a8222ecc892e","eb":"a9789b9943b46ebd"},{"zh":"我们组个队吧！","py":"wǒ men zǔ gè duì ba!","en":"Let's make a team!","ic":"👫","ex":"好，我们是红队！","exen":"Okay, we're the red team!","a":"921430087fe86d80","b":"084363ce920f1c73","e":"577cfc409eb20342","eb":"19b22577bd49f4b4"},{"zh":"输了也没关系。","py":"shū le yě méi guān xi.","en":"It's okay to lose.","ic":"🙂","ex":"下次我们再加油！","exen":"We'll try harder next time!","a":"4ebf46d58b9756c2","b":"230a2d96844aca1e","e":"eff833761b7e4065","eb":"05c592e705c14e40"},{"zh":"你玩得真好！","py":"nǐ wán de zhēn hǎo!","en":"You played really well!","ic":"👏","ex":"谢谢，一起玩更开心！","exen":"Thanks, it's more fun together!","a":"6dfeebf4867b2988","b":"80e3d81ab61f6bce","e":"ed316d4b964e6dc9","eb":"3c640dba8b84a553"},{"zh":"你当医生，我当病人。","py":"nǐ dāng yī shēng, wǒ dāng bìng rén.","en":"You be the doctor, I'll be the patient.","ic":"🩺","ex":"好，哪里不舒服呀？","exen":"Okay, where does it hurt?","a":"05d0271a7ffee052","b":"37d6f5413b10fc75","e":"f853ee86a477503f","eb":"778e310903a53461"},{"zh":"等等我！","py":"děng deng wǒ!","en":"Wait for me!","ic":"🙌","ex":"快来，我们等你！","exen":"Hurry, we're waiting for you!","a":"f2fa2bfc6c179786","b":"c6f58ea5f16d958b","e":"f70c177dc37acefd","eb":"0178931edab21b14"},{"zh":"我们一起爬攀爬架。","py":"wǒ men yì qǐ pá pān pá jià.","en":"Let's climb the climbing frame together.","ic":"🧗","ex":"抓稳了，慢慢爬。","exen":"Hold on tight and climb slowly.","a":"1a2b10d8d619b63f","b":"e6b2920b30165c3e","e":"8fc8ba5dbc653c80","eb":"98d7f657b028c0fa"},{"zh":"要回家了，拜拜！","py":"yào huí jiā le, bái bái!","en":"Time to go home, bye-bye!","ic":"👋","ex":"拜拜，下次再一起玩！","exen":"Bye, let's play again next time!","a":"651c5cabae763f64","b":"6b56404339c10dc4","e":"877e3e71e5ee55cf","eb":"968686ace9490356"},{"zh":"我们一起吹泡泡。","py":"wǒ men yì qǐ chuī pào pao.","en":"Let's blow bubbles together.","ic":"🫧","ex":"哇，泡泡飞得好高！","exen":"Wow, the bubbles are flying so high!","a":"e3481839c22eb501","b":"645b64e9a6779674","e":"6a9f789430b69c7d","eb":"10e430e6eee2ea6d"}]},{"id":"L4-why","cat":"why","zh":"好奇提问十万个为什么","en":"Questions & Why","emoji":"❓","pal":{"sky1":"#2B2F6B","sky2":"#6A5BB0","main":"#4C4AA0","deep":"#26245E","dd":"#1B1943" rth turns away, and the sun shines on other places.","a":"121c92ab3ae6d3ec","b":"51a87e7e0728bff9","e":"ca0e9dda2cf71235","eb":"ffe47321bb157f47"},{"zh":"为什么会有影子？","py":"wèi shén me huì yǒu yǐng zi?","en":"Why are there shadows?","ic":"👤","ex":"身体挡住了光，就有影子。","exen":"Your body blocks the light, making a shadow.","a":"ccbbe712d94de290","b":"1de6ab51709f099f","e":"ea602ef1d2c4b72c","eb":"eb8888cc4aaf08c1"},{"zh":"小猫为什么总舔毛？","py":"xiǎo māo wèi shén me zǒng tiǎn máo?","en":"Why do cats always lick their fur?","ic":"🐱","ex":"它在用舌头给自己洗澡。","exen":"It's giving itself a bath with its tongue.","a":"98f2372dea012b9e","b":"60f6aff2b715421c","e":"8e6fd625ac67a1e8","eb":"7af46b497eb110a2"},{"zh":"为什么会打喷嚏？","py":"wèi shén me huì dǎ pēn tì?","en":"Why do we sneeze?","ic":"🤧","ex":"鼻子把灰尘赶出去。","exen":"Your nose pushes dust out.","a":"f4e5db7f85f22f68","b":"57495edb033ac9c9","e":"bd7292aed72a63fb","eb":"9efc2a50410bae32"},{"zh":"为什么海水是咸的？","py":"wèi shén me hǎi shuǐ shì xián de?","en":"Why is seawater salty?","ic":"🌊","ex":"海水里溶着很多盐。","exen":"Lots of salt is dissolved in seawater.","a":"5b312ad8707c9074","b":"f761d08cace0d857","e":"b5180df99fd7e976","eb":"d9252e3dcf6c73a4"},{"zh":"袋鼠宝宝住在哪里？","py":"dài shǔ bǎo bao zhù zài nǎ lǐ?","en":"Where do baby kangaroos live?","ic":"🦘","ex":"住在妈妈肚子上的育儿袋里。","exen":"In the pouch on their mum's tummy.","a":"0cb6ef06e2eaccd0","b":"51feea2ee65451db","e":"c9b825ae2118d5b1","eb":"658cc332167faf00"},{"zh":"为什么要洗手？","py":"wèi shén me yào xǐ shǒu?","en":"Why do we wash our hands?","ic":"🧼","ex":"洗掉看不见的细菌。","exen":"To wash away germs we can't see.","a":"6d522e8ac3f6e2a2","b":"cb49a4b6e3a0e826","e":"4f6cc19a20e9fb8f","eb":"36a8b9781d3ed0fe"},{"zh":"飞机为什么能飞？","py":"fēi jī wèi shén me néng fēi?","en":"How can planes fly?","ic":"✈️","ex":"跑得很快时，机翼被空气托起来。","exen":"When it goes fast, the air lifts its wings.","a":"5b4b5ee1aee6d972","b":"5d61573ba11a8bb2","e":"c8d53ecdc6eaef1d","eb":"acb7a11d0ea36bb7"},{"zh":"为什么冬天很冷？","py":"wèi shén me dōng tiān hěn lěng?","en":"Why is winter cold?","ic":"❄️","ex":"冬天阳光斜斜照，热量少。","exen":"In winter sunlight comes in at a slant and gives less heat.","a":"5b401f8654703827","b":"5af4b54e95af1638","e":"0866a70b14b39ba9","eb":"555a427928875b7b"},{"zh":"圣诞节为什么这么热？","py":"shèng dàn jié wèi shén me zhè me rè?","en":"Why is Christmas so hot here?","ic":"🎄","ex":"澳大利亚的圣诞节在夏天。","exen":"In Australia, Christmas is in summer.","a":"d676317c2acd06ec","b":"749ffa896b2f9b0c","e":"1a0acecafb9061ac","eb":"b1901f587ebcc5b8"},{"zh":"为什么会有白天和黑夜？","py":"wèi shén me huì yǒu bái tiān hé hēi yè?","en":"Why are there day and night?","ic":"🌗","ex":"地球一直在转圈圈。","exen":"Because Earth keeps spinning around.","a":"fbe6971a8e637279","b":"517fada028eac4b8","e":"ebfb1eb57ad8b073","eb":"08bc5972ef8df9f3"},{"zh":"蜜蜂为什么要采蜜？","py":"mì fēng wèi shén me yào cǎi mì?","en":"Why do bees collect nectar?","ic":"🐝","ex":"它们用花蜜酿蜂蜜当食物。","exen":"They turn nectar into honey for food.","a":"f6489824be250763","b":"fc90c87859d077b0","e":"4a2ca55190bca1a4","eb":"87dd4bc6dc51f1b2"},{"zh":"为什么苹果会掉下来？","py":"wèi shén me píng guǒ huì diào xià lai?","en":"Why do apples fall down?","ic":"🍏","ex":"地球有引力，把它往下拉。","exen":"Earth's gravity pulls them down.","a":"06183f414586aa8a","b":"636b347ba29cd803","e":"d867da3015dc88d4","eb":"0a77868817dc4237"},{"zh":"毛毛虫会变成什么？","py":"máo mao chóng huì biàn chéng shén me?","en":"What do caterpillars turn into?","ic":"🐛","ex":"会变成蝴蝶或者飞蛾。","exen":"They turn into butterflies or moths.","a":"5b1055f349885d90","b":"06a5ae03ce1e9bf2","e":"22d57bfe7259af57","eb":"305cad42343fc338"},{"zh":"为什么要多喝水？","py":"wèi shén me yào duō hē shuǐ?","en":"Why should we drink lots of water?","ic":"💧","ex":"身体里大部分是水呀。","exen":"Most of your body is water.","a":"8bebf2382254b1d8","b":"40d0eec7051aa4a2","e":"de2db693361a3c6a","eb":"7f54d0fa96549365"},{"zh":"为什么月亮跟着我走？","py":"wèi shén me yuè liang gēn zhe wǒ zǒu?","en":"Why does the moon follow me?","ic":"🌕","ex":"月亮很远很远，看着像跟你走。","exen":"The moon is so far away it seems to follow you.","a":"b43c746871dfe57f","b":"8725bf2385e5f37f","e":"cea5cf1ae63b1cf6","eb":"a05b935c42ab51f8"},{"zh":"雪是怎么来的？","py":"xuě shì zěn me lái de?","en":"Where does snow come from?","ic":"🌨️","ex":"云里很冷，水汽结成小冰花。","exen":"In cold clouds, water vapour freezes into ice crystals.","a":"3a1f0526ce1a6cec","b":"f7017a17e1638172","e":"fe3e6f27266e9b39","eb":"8b514eef89fc38d3"},{"zh":"为什么会有回声？","py":"wèi shén me huì yǒu huí shēng?","en":"Why are there echoes?","ic":"🗣️","ex":"声音碰到墙又弹回来了。","exen":"Sound hits a wall and bounces back.","a":"d88742a97cfc4946","b":"afe18c886c4cc620","e":"0049d3e62e0f3b6c","eb":"28a3cd0b11797bbe"},{"zh":"恐龙去哪里了？","py":"kǒng lóng qù nǎ lǐ le?","en":"Where did the dinosaurs go?","ic":"🦕","ex":"很久以前灭绝了，鸟是它们的后代。","exen":"They died out long ago; birds are their descendants.","a":"f3de661f02c40e9e","b":"2a67e96f07991ef6","e":"cfca8338719673a2","eb":"f6269a6dfda1c21d"}]},{"id":"L4-safety","cat":"safety","zh":"安全常识与自我保护","en":"Safety Sentences","emoji":"🛡️","pal":{"sky1":"#DCE6F2","sky2":"#F6F8FB","main":"#647DA3","deep":"#3F557A","dd":"#2D3D57","sun":"#FFD98A"},"scenery":"<img class=\"scenery\" src=\"icons_v9/world_safety.webp\" alt=\"\" loading=\"lazy\" decoding=\"async\" draggable=\"false\"/>","badge":"<svg class=\"badge\" viewBox=\"0 0 120 140\" aria-hidden=\"true\"><path d=\"M38 92 L28 136 L44 126 L54 138 L60 98Z\" fill=\"#B53A30\" stroke=\"#8E2A22\" stroke-width=\"1.5\"/><path d=\"M82 92 L92 136 L76 126 L66 138 L60 98Z\" fill=\"#B53A30\" stroke=\"#8E2A22\" stroke-width=\"1.5\"/><path d=\"M60.0,8.0 L68.5,13.7 L78.5,11.3 L84.5,19.6 L94.7,20.6 L97.5,30.5 L106.8,35.0 L106.0,45.2 L113.2,52.6 L109.0,62.0 L113.2,71.4 L106.0,78.8 L106.8,89.0 L97.5,93.5 L94.7,103.4 L84.5,104.4 L78.5,112.7 L68.5,110.3 L60.0,116.0 L51.5,110.3 L41.5,112.7 L35.5,104.4 L25.3,103.4 L22.5,93.5 L13.2,89.0 L14.0,78.8 L6.8,71.4 L11.0,62.0 L6.8,52.6 L14.0,45.2 L13.2,35.0 L22.5,30.5 L25.3,20.6 L35.5,19.6 L41.5,11.3 L51.5,13.7 Z\" fill=\"#8A5A12\" transform=\"translate(0 3)\"/><path d=\"M60.0,8.0 L68.5,13.7 L78.5,11.3 L84.5,19.6 L94.7,20.6 L97.5,30.5 L106.8,35.0 L106.0,45.2 L113.2,52.6 L109.0,62.0 L113.2,71.4 L106.0,78.8 L106.8,89.0 L97.5,93.5 L94.7,103.4 L84.5,104.4 L78.5,112.7 L68.5,110.3 L60.0,116.0 L51.5,110.3 L41.5,112.7 L35.5,104.4 L25.3,103.4 L22.5,93.5 L13.2,89.0 L14.0,78.8 L6.8,71.4 L11.0,62.0 L6.8,52.6 L14.0,45.2 L13.2,35.0 L22.5,30.5 L25.3,20.6 L35.5,19.6 L41.5,11.3 L51.5,13.7 Z\" fill=\"url(#gGold)\" stroke=\"#A8761E\" stroke-width=\"1\"/><circle cx=\"60\" cy=\"62\" r=\"43\" fill=\"#3F557A\"/><circle cx=\"60\" cy=\"62\" r=\"39\" fill=\"#647DA3\"/><circle cx=\"60\" cy=\"62\" r=\"39\" fill=\"url(#gShine)\"/><circle cx=\"60\" cy=\"62\" r=\"34\" fill=\"none\" stroke=\"#FFF3C6\" stroke-width=\"1.4\" stroke-dasharray=\"1.5 4\" stroke-linecap=\"round\"/><text x=\"60\" y=\"76\" font-size=\"38\" text-anchor=\"middle\" filter=\"url(#fEmoji)\">🛡️<\/text><path d=\"M60 4l2.6 5.4 6 .7-4.4 4.1 1.2 5.9L60 17.2l-5.4 2.9 1.2-5.9-4.4-4.1 6-.7z\" fill=\"#FFF3C6\" stroke=\"#A8761E\" stroke-width=\".8\"/><rect x=\"38\" y=\"94\" width=\"44\" height=\"15\" rx=\"7.5\" fill=\"#FFF8EA\" stroke=\"#8E2A22\" stroke-width=\"1.4\"/><text x=\"60\" y=\"105.5\" font-size=\"10\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8E2A22\" font-family=\"ui-rounded,Avenir Next,sans-serif\">L4·08<\/text><\/svg>","items":[{"zh":"过马路要看红绿灯。","py":"guò mǎ lù yào kàn hóng lǜ dēng.","en":"Check the traffic lights when crossing the road.","ic":"🚦","ex":"红灯停，绿灯行。","exen":"Red means stop, green means go.","a":"4df951cd0f6ea7b6","b":"ac07611a5287efff","e":"6a57106c84e7c0eb","eb":"a102789caaf5c45a"},{"zh":"不跟陌生人走。","py":"bù gēn mò shēng rén zǒu.","en":"Don't go with strangers.","ic":"🙅","ex":"有人叫你，先问爸爸妈妈。","exen":"If someone calls you, ask Mum or Dad first.","a":"ab92910a652dc124","b":"ce3c05850aea48e7","e":"d64661bbfbaa82d7","eb":"0ad5b6410e6510e4"},{"zh":"紧急情况打零零零。","py":"jǐn jí qíng kuàng dǎ líng líng líng.","en":"In an emergency, call triple zero.","ic":"📞","ex":"说清楚地址和发生了什么。","exen":"Say your address and what happened.","a":"277bb9547820d78e","b":"75d6aa7210e6df2f","e":"74cece5b523ce383","eb":"dc35553548a94072"},{"zh":"走斑马线过马路。","py":"zǒu bān mǎ xiàn guò mǎ lù.","en":"Cross at the zebra crossing.","ic":"🦓","ex":"先看右，再看左，再看右。","exen":"Look right, then left, then right again.","a":"8cbe62fd8f313ce7","b":"f5bd190a86009f11","e":"46ad2ef807a00448","eb":"9c131bb76f165e9b"},{"zh":"不玩火柴和打火机。","py":"bù wán huǒ chái hé dǎ huǒ jī.","en":"Don't play with matches or lighters.","ic":"🔥","ex":"火很危险，会烫伤人。","exen":"Fire is dangerous and can burn you.","a":"286444db26c1e806","b":"176f7382ab0b6166","e":"4ca0463e4c01a940","eb":"c3c94c75f14af562"},{"zh":"不摸插座。","py":"bù mō chā zuò.","en":"Don't touch power points.","ic":"🔌","ex":"手指伸进去会触电。","exen":"Poking fingers in can give you a shock.","a":"d8caa0d4ea39c263","b":"4de8eb9ea494d371","e":"f96490576aeb6307","eb":"416e11a8a9a2564e"},{"zh":"游泳要有大人陪。","py":"yóu yǒng yào yǒu dà rén péi.","en":"Only swim with a grown-up.","ic":"🏖️","ex":"在海滩要在红黄旗中间游。","exen":"At the beach, swim between the red and yellow flags.","a":"8dafebfd77e8aae7","b":"a702a0646d34f59b","e":"a4e66f7400ce5164","eb":"90ea43006439000e"},{"zh":"坐车要系安全带。","py":"zuò chē yào jì ān quán dài.","en":"Wear your seatbelt in the car.","ic":"🚙","ex":"小朋友要坐安全座椅。","exen":"Kids ride in a car seat.","a":"1e3a184d98f58654","b":"9a12d1f444bf02fe","e":"d48e7e0fd7cd5c6b","eb":"be0b50c44f06b8cb"},{"zh":"记住爸爸妈妈的电话。","py":"jì zhù bà ba mā ma de diàn huà.","en":"Remember Mum and Dad's phone number.","ic":"📱","ex":"迷路时可以请警察打电话。","exen":"If you're lost, a police officer can call them.","a":"b512e7305dda19ff","b":"521005caea127847","e":"5c8f2a11bc9f8c36","eb":"07103a542fd4d64a"},{"zh":"我走丢了要站在原地。","py":"wǒ zǒu diū le yào zhàn zài yuán dì.","en":"If I get lost, I stay where I am.","ic":"🧍","ex":"爸爸妈妈会回来找我。","exen":"Mum and Dad will come back to find me.","a":"801e5f720c3ac676","b":"aefbfccb175e1317","e":"09097882456c9402","eb":"ecccee374352b3c6"},{"zh":"不吃陌生人给的东西。","py":"bù chī mò shēng rén gěi de dōng xi.","en":"Don't eat food from strangers.","ic":"🍬","ex":"礼貌地说：不用了，谢谢。","exen":"Politely say: \"No, thank you.\"","a":"568e355523bca7de","b":"d012866545d51b90","e":"2406fa50e46adb22","eb":"f301bfae21982c90"},{"zh":"我的身体我做主。","py":"wǒ de shēn tǐ wǒ zuò zhǔ.","en":"My body belongs to me.","ic":"🛡️","ex":"不舒服就大声说不！","exen":"If something feels wrong, say \"No!\" loudly.","a":"a682a8c2bc4a4eda","b":"f7375a8d2d6470ab","e":"4484781358238b41","eb":"42a38a35957f5a5d"},{"zh":"陌生人敲门不开门。","py":"mò shēng rén qiāo mén bù kāi mén.","en":"Don't open the door to strangers.","ic":"🚪","ex":"先叫爸爸妈妈来。","exen":"Call Mum or Dad first.","a":"5a1256b39a899ae2","b":"1edab31fc0d2ff64","e":"8a4160bc6ceda31e","eb":"4413db3b9541f3a3"},{"zh":"不爬窗户和阳台。","py":"bù pá chuāng hu hé yáng tái.","en":"Don't climb on windows or balconies.","ic":"🪟","ex":"从高处掉下来很危险。","exen":"Falling from up high is dangerous.","a":"23ad37a5fde9fac4","b":"146f4c055485f287","e":"0512738d5a056b54","eb":"c8f900414e7f67e5"},{"zh":"刀子很锋利，不要碰。","py":"dāo zi hěn fēng lì, bú yào pèng.","en":"Knives are sharp, don't touch them.","ic":"🔪","ex":"需要时请大人帮忙。","exen":"Ask a grown-up for help when you need one.","a":"fe96038e1c940dc7","b":"977d82bcc74d6c8a","e":"0e01bfee9eae5c92","eb":"414d5a2eacf46bde"},{"zh":"药不能随便吃。","py":"yào bù néng suí biàn chī.","en":"Never take medicine on your own.","ic":"💊","ex":"生病了，听医生和大人的。","exen":"When you're sick, listen to the doctor and grown-ups.","a":"6abd3d97e7afa01b","b":"d5408936a5ea6a9b","e":"61e7d85f23fa2407","eb":"0c9a3c02012c02cf"},{"zh":"地上滑，慢慢走。","py":"dì shang huá, màn màn zǒu.","en":"The floor is slippery, walk slowly.","ic":"⚠️","ex":"小心别摔跤哦。","exen":"Careful not to slip over.","a":"d057b3c304ac2386","b":"52549fbdb420471c","e":"ac2ee92da1467a28","eb":"0e679fc40299bf7b"},{"zh":"出门戴帽子，涂防晒。","py":"chū mén dài mào zi, tú fáng shài.","en":"Wear a hat and sunscreen outside.","ic":"🧢","ex":"澳洲太阳很晒，要保护皮肤。","exen":"The Aussie sun is strong, protect your skin.","a":"f0fe44e46101d72a","b":"ca4031fcac7218e8","e":"bd85c27f3d8e915b","eb":"52093932979c29c0"},{"zh":"骑车要戴头盔。","py":"qí chē yào dài tóu kuī.","en":"Wear a helmet when you ride.","ic":"🚲","ex":"在澳洲骑车必须戴头盔。","exen":"In Australia you must wear a helmet to ride a bike.","a":"475ededa4385c27e","b":"b5ab4d79136a339b","e":"2382bd8bbf32bd3f","eb":"d781caac4e3bc58b"},{"zh":"不在马路上玩。","py":"bú zài mǎ lù shang wán.","en":"Don't play on the road.","ic":"🚗","ex":"车很快，要在公园里玩。","exen":"Cars are fast, play in the park instead.","a":"aeeecfff0d6a2c94","b":"7cfeb8c7f4c41d32","e":"f74af29efd156886","eb":"d99672fe9feaaf46"},{"zh":"着火了要快跑出去。","py":"zháo huǒ le yào kuài pǎo chū qu.","en":"If there's a fire, get out fast.","ic":"🚒","ex":"弯下腰，捂住口鼻。","exen":"Stay low and cover your nose and mouth.","a":"78e6b67efc5e0bf3","b":"cc9f04bc175e0c1b","e":"39cf3df5514d4a03","eb":"6f69f9b601e86777"},{"zh":"别把小东西放进嘴里。","py":"bié bǎ xiǎo dōng xi fàng jìn zuǐ lǐ.","en":"Don't put small things in your mouth.","ic":"👄","ex":"会卡住喉咙，很危险。","exen":"They can get stuck in your throat — dangerous!","a":"b101797466feb34c","b":"bfa825f2b787a7d6","e":"cc01a10314db8a7c","eb":"eb6383e5d2667495"},{"zh":"不随便摸陌生的狗。","py":"bù suí biàn mō mò shēng de gǒu.","en":"Don't pat dogs you don't know.","ic":"🐕","ex":"先问主人可不可以。","exen":"Ask the owner first.","a":"a411bafb8044af8b","b":"016acc1c4d83321c","e":"e69b06d68146726e","eb":"26b1c8ab23fb2864"},{"zh":"雷雨天不在树下躲雨。","py":"léi yǔ tiān bú zài shù xià duǒ yǔ.","en":"Don't shelter under trees in a thunderstorm.","ic":"🌩️","ex":"要躲进房子里。","exen":"Go inside a building.","a":"19dcdb2308c8226e","b":"9841a0e4ecbc645c","e":"104a56ee2f78c4e4","eb":"3fde1d1356e219b1"},{"zh":"不好的秘密要说出来。","py":"bù hǎo de mì mì yào shuō chū lai.","en":"Bad secrets should be told.","ic":"🤫","ex":"告诉你信任的大人。","exen":"Tell a grown-up you trust.","a":"a90b5b8c91072897","b":"d44b00a42757936a","e":"48005b2357feae33","eb":"49291d30b9a2563e"},{"zh":"在商场跟紧大人。","py":"zài shāng chǎng gēn jǐn dà rén.","en":"Stay close to grown-ups at the shops.","ic":"🛍️","ex":"人多的地方别乱跑。","exen":"Don't run off in crowded places.","a":"995117ed6a8b7b44","b":"87dbbb88e8c157f4","e":"f80a7ac92c53feaf","eb":"0dc71c535ce2d2c7"},{"zh":"小心热水，别烫伤。","py":"xiǎo xīn rè shuǐ, bié tàng shāng.","en":"Careful of hot water, don't get burned.","ic":"🫖","ex":"让大人帮你倒热水。","exen":"Let a grown-up pour hot water for you.","a":"328d858d9de050d1","b":"4e999cb5344114cc","e":"55e48d7d161d6225","eb":"6af16f291a6cef18"},{"zh":"在泳池边不奔跑。","py":"zài yǒng chí biān bù bēn pǎo.","en":"No running beside the pool.","ic":"🏊","ex":"地面湿滑，容易摔倒。","exen":"The ground is wet and slippery.","a":"af4f03a435c1e41a","b":"8245ce78727edac5","e":"665fc75b14af0ff4","eb":"d7598b3e32f7ba9c"},{"zh":"我会说家里的地址。","py":"wǒ huì shuō jiā lǐ de dì zhǐ.","en":"I can say my home address.","ic":"🏠","ex":"紧急时告诉警察叔叔。","exen":"Tell a police officer in an emergency.","a":"9adc84b2b979e44b","b":"c7d306ae0ab39560","e":"fd109cd8c8ce69bd","eb":"9db6a745c2c933e3"},{"zh":"见到蛇不要靠近。","py":"jiàn dào shé bú yào kào jìn.","en":"Stay away from snakes.","ic":"🐍","ex":"慢慢走开，告诉大人。","exen":"Back away slowly and tell a grown-up.","a":"46cfe8a4aca2451b","b":"6dde3e99cc3b7978","e":"f376edbd83bb1610","eb":"90a94d9417ed904c"},{"zh":"遇到危险大声喊救命。","py":"yù dào wēi xiǎn dà shēng hǎn jiù mìng.","en":"Shout \"Help!\" when you're in danger.","ic":"📢","ex":"然后跑向安全的地方。","exen":"Then run to a safe place.","a":"e2613f0fbebfd580","b":"0bc3f2882832e2dc","e":"c0c35baabf0e26ff","eb":"004353fef8e6976a"},{"zh":"不在电梯里打闹。","py":"bú zài diàn tī lǐ dǎ nào.","en":"No mucking around in the lift.","ic":"🛗","ex":"按好楼层，安静等待。","exen":"Press your floor and wait quietly.","a":"3755e1cda7158cfe","b":"e81548f259fe68c8","e":"804241702f7895af","eb":"81c965b4d23c279c"}]},{"id":"L4-story","cat":"story","zh":"看图讲故事短句","en":"Storytelling Sentences","emoji":"📖","pal":{"sky1":"#D4ECD9","sky2":"#F4F0DC","main":"#4C8A5B","deep":"#2E5E3B","dd":"#21432A","sun":"#FFE08A"},"scenery":"<img class=\"scenery\" src=\"icons_v9/world_story.webp\" alt=\"\" loading=\"lazy\" decodin
